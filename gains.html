<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Lift Ledger - a single-file workout tracker with a rest timer, interval timer, plate calculator and a training log that remembers every set.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#F1EDE4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#101216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Ledger">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23191A1E'/%3E%3Cg stroke='%23F1EDE4' stroke-width='2.6' stroke-linecap='round'%3E%3Cpath d='M7 12v8M11 9.5v13M21 9.5v13M25 12v8M11 16h10'/%3E%3C/g%3E%3C/svg%3E">
<!-- =====================================================================
     LIFT LEDGER - workout tracker with the timer built in.
     One file, no build step, no accounts, no network calls.
     Open it, add it to your home screen, train.

     Everything is saved in this browser's localStorage under the key
     "liftledger.v1". Settings > Data has Copy / Load so you can move
     the log between devices.

     EASY TO CHANGE:
       - Starting routines: seedRoutines() in the script below
       - Colors: the token block at the top of the stylesheet
       - Rest presets: the [60, 90, 120, 180] array in viewTimer()
       - Plate sizes: the "sizes" array in plateMath()
     ===================================================================== -->
<title>Lift Ledger</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600&family=Source+Sans+3:ital,wght@0,400;0,600;0,700;1,400&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* ---------- reset ---------- */
*,*::before,*::after{box-sizing:border-box}
body{margin:0}
img{max-width:100%}
[hidden]{display:none!important}
:root{padding:env(safe-area-inset-top,0px) 0 env(safe-area-inset-bottom,0px)}

/* ---------- tokens: chalk & iron ----------
   Accent hues are lifted from competition plates:
   25 kg red, 20 kg blue, 10 kg green, 15 kg yellow. */
:root{
  color-scheme:light;
  --paper:#F1EDE4;
  --surface:#FBF9F4;
  --surface-2:#E7E1D4;
  --ink:#191A1E;
  --ink-2:#4B4D56;
  --ink-3:#82848F;
  --line:#D8D1C3;
  --line-2:#C4BBA8;
  --red:#C0202D;
  --red-wash:#F6DDDF;
  --blue:#1A5C9E;
  --blue-wash:#DCE6F2;
  --green:#1C7148;
  --green-wash:#D9EBE1;
  --amber:#A8761A;
  --shadow-1:0 1px 2px rgba(25,26,30,.07);
  --shadow-2:0 2px 4px rgba(25,26,30,.06),0 14px 30px -22px rgba(25,26,30,.55);
  --r-s:6px; --r-m:10px; --r-l:16px;
  --display:"Oswald","Haettenschweiler","Arial Narrow",sans-serif;
  --body:"Source Sans 3","Segoe UI",Helvetica,Arial,sans-serif;
  --mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --paper:#101216;
    --surface:#191C22;
    --surface-2:#232830;
    --ink:#EDEBE5;
    --ink-2:#B0B4BE;
    --ink-3:#797E8A;
    --line:#2B303A;
    --line-2:#3A414D;
    --red:#EC5D6B;
    --red-wash:#39191E;
    --blue:#6FA9E2;
    --blue-wash:#152534;
    --green:#4FB98A;
    --green-wash:#12291F;
    --amber:#DDA63C;
    --shadow-1:0 1px 2px rgba(0,0,0,.4);
    --shadow-2:0 2px 4px rgba(0,0,0,.35),0 14px 30px -22px rgba(0,0,0,.9);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --paper:#101216;
  --surface:#191C22;
  --surface-2:#232830;
  --ink:#EDEBE5;
  --ink-2:#B0B4BE;
  --ink-3:#797E8A;
  --line:#2B303A;
  --line-2:#3A414D;
  --red:#EC5D6B;
  --red-wash:#39191E;
  --blue:#6FA9E2;
  --blue-wash:#152534;
  --green:#4FB98A;
  --green-wash:#12291F;
  --amber:#DDA63C;
  --shadow-1:0 1px 2px rgba(0,0,0,.4);
  --shadow-2:0 2px 4px rgba(0,0,0,.35),0 14px 30px -22px rgba(0,0,0,.9);
}

body{
  background:var(--paper);
  color:var(--ink);
  font-family:var(--body);
  font-size:16px;
  line-height:1.5;
  -webkit-text-size-adjust:100%;
  -webkit-tap-highlight-color:transparent;
}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;margin:0;letter-spacing:.005em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px;border-radius:4px}

/* ---------- shell ---------- */
.wrap{max-width:820px;margin:0 auto;padding-inline:16px}
.topbar{
  position:sticky;top:env(safe-area-inset-top,0px);z-index:40;
  background:var(--paper);
  background:color-mix(in srgb,var(--paper) 88%,transparent);
  backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.topbar-in{display:flex;align-items:center;gap:12px;min-height:52px}
.brand{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.mark{
  width:26px;height:26px;flex:none;display:grid;place-items:center;
  background:var(--ink);color:var(--paper);border-radius:var(--r-s);
  font-family:var(--display);font-size:13px;letter-spacing:.06em;padding-left:1px;
}
.wordmark{font-family:var(--display);font-size:18px;letter-spacing:.02em;white-space:nowrap}
.icon-btn{
  width:36px;height:36px;flex:none;display:grid;place-items:center;
  background:transparent;border:1px solid transparent;border-radius:var(--r-m);color:var(--ink-2);
}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.icon-btn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
main{padding-block:18px 8px}
.spacer{height:150px}

/* ---------- type helpers ---------- */
.eyebrow{
  font-family:var(--display);font-size:11px;font-weight:500;letter-spacing:.14em;
  text-transform:uppercase;color:var(--ink-3);
}
.view-title{font-size:26px;line-height:1.15;margin-bottom:2px}
.sub{color:var(--ink-2);font-size:14.5px;margin:2px 0 0}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;font-feature-settings:"tnum"}
.stack{display:flex;flex-direction:column;gap:14px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pull-right{margin-left:auto}

/* ---------- buttons ---------- */
.btn{
  display:inline-flex;align-items:center;justify-content:center;gap:7px;
  padding:10px 15px;border-radius:var(--r-m);border:1px solid var(--line-2);
  background:var(--surface);color:var(--ink);
  font-family:var(--display);font-size:14.5px;font-weight:500;letter-spacing:.03em;
  box-shadow:var(--shadow-1);
}
.btn:hover{border-color:var(--ink-3)}
.btn:active{transform:translateY(1px)}
.btn-primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.btn-primary:hover{background:var(--ink-2);border-color:var(--ink-2)}
.btn-accent{background:var(--red);color:#fff;border-color:var(--red)}
.btn-ghost{background:transparent;border-color:var(--line);box-shadow:none;color:var(--ink-2)}
.btn-ghost:hover{color:var(--ink);background:var(--surface)}
.btn-sm{padding:6px 11px;font-size:13px}
.btn-block{width:100%}
.btn-danger{color:var(--red);border-color:color-mix(in srgb,var(--red) 40%,var(--line))}
.btn[disabled]{opacity:.45;pointer-events:none}

/* ---------- cards ---------- */
.card{
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);
  box-shadow:var(--shadow-1);
}
.card-pad{padding:15px 16px}
.rule{height:1px;background:var(--line);border:0;margin:0}

/* ---------- stat strip ---------- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.stat{background:var(--surface);padding:9px 12px 10px}
.stat .k{font-family:var(--display);font-size:10.5px;letter-spacing:.13em;text-transform:uppercase;color:var(--ink-3)}
.stat .v{font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:19px;font-weight:600;line-height:1.25}
.stat .v small{font-size:11px;font-weight:500;color:var(--ink-3);margin-left:2px}

/* ---------- routine picker ---------- */
.pick{display:grid;gap:10px}
.pick-item{
  display:flex;align-items:center;gap:13px;text-align:left;width:100%;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:13px 14px;box-shadow:var(--shadow-1);
}
.pick-item:hover{border-color:var(--ink-3)}
.pick-item .bar{width:4px;align-self:stretch;border-radius:2px;background:var(--red);flex:none}
.pick-item .t{display:block;font-family:var(--display);font-size:17px;line-height:1.2}
.pick-item .m{display:block;font-size:13px;color:var(--ink-2);margin-top:2px}
.pick-item .go{margin-left:auto;color:var(--ink-3);font-family:var(--display);font-size:13px;letter-spacing:.08em;white-space:nowrap}

/* ---------- exercise card ---------- */
.ex{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-l);box-shadow:var(--shadow-1);overflow:hidden}
.ex.complete{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.ex-head{display:flex;align-items:flex-start;gap:10px;padding:13px 14px 10px}
.ex-head h3{font-size:18px;line-height:1.2}
.ex-meta{font-size:12.5px;color:var(--ink-3);margin-top:2px;font-family:var(--mono)}
.ex-last{
  padding:7px 14px;background:var(--surface-2);border-block:1px solid var(--line);
  font-size:12.5px;color:var(--ink-2);font-family:var(--mono);
  overflow-x:auto;white-space:nowrap;
}
.ex-last b{color:var(--ink);font-weight:600}
table.sets{width:100%;border-collapse:collapse}
table.sets th{
  font-family:var(--display);font-size:10.5px;letter-spacing:.12em;text-transform:uppercase;
  color:var(--ink-3);font-weight:500;text-align:left;padding:8px 6px 4px;
}
table.sets th:first-child{padding-left:14px;width:42px}
table.sets th:last-child{padding-right:14px;width:52px}
table.sets td{padding:4px 6px;border-top:1px solid var(--line)}
table.sets td:first-child{padding-left:14px}
table.sets td:last-child{padding-right:14px}
table.sets tbody tr:first-child td{border-top:1px solid var(--line)}
.setno{font-family:var(--mono);font-size:13px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.inp{
  width:100%;min-width:0;padding:9px 8px;text-align:center;
  background:var(--paper);border:1px solid var(--line-2);border-radius:var(--r-s);
  font-family:var(--mono);font-variant-numeric:tabular-nums;font-size:16px;font-weight:500;
}
.inp::placeholder{color:var(--ink-3);font-weight:400}
.inp:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
tr.done .inp{background:transparent;border-color:transparent;color:var(--ink-2)}
tr.done .setno{color:var(--green)}
.check{
  width:40px;height:38px;display:grid;place-items:center;border-radius:var(--r-s);
  border:1px solid var(--line-2);background:var(--paper);color:var(--ink-3);
}
.check svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round}
.check:hover{border-color:var(--green);color:var(--green)}
tr.done .check{background:var(--green);border-color:var(--green);color:#fff}
.pr{
  display:inline-block;margin-left:5px;padding:1px 5px;border-radius:4px;
  background:var(--green-wash);color:var(--green);
  font-family:var(--display);font-size:10px;letter-spacing:.1em;text-transform:uppercase;vertical-align:2px;
}
.ex-actions{display:flex;gap:8px;padding:10px 14px 13px;flex-wrap:wrap}

/* ---------- dock: rest timer + tabs ---------- */
.dock{position:fixed;left:0;right:0;bottom:0;z-index:50}
.dock-in{max-width:820px;margin:0 auto;padding-inline:16px}
.timer-strip{
  display:flex;align-items:center;gap:10px;margin-bottom:8px;padding:9px 10px 9px 14px;
  background:var(--ink);color:var(--paper);border-radius:var(--r-l);box-shadow:var(--shadow-2);
}
.timer-strip .lbl{font-family:var(--display);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;opacity:.65}
.timer-strip .cd{font-family:var(--display);font-size:27px;font-weight:500;line-height:1;font-variant-numeric:tabular-nums}
.timer-strip .cd.warn{color:var(--amber)}
.tstrip-btn{
  padding:7px 11px;border-radius:var(--r-s);border:1px solid rgba(255,255,255,.28);
  background:transparent;color:inherit;font-family:var(--display);font-size:13px;letter-spacing:.04em;
}
.tstrip-btn:hover{background:rgba(255,255,255,.14)}
.tabbar{
  display:grid;grid-template-columns:repeat(5,1fr);
  background:var(--surface);border:1px solid var(--line);
  border-radius:var(--r-l) var(--r-l) 0 0;border-bottom:0;
  box-shadow:var(--shadow-2);
  padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));
}
.tab{
  display:flex;flex-direction:column;align-items:center;gap:3px;padding:7px 2px 5px;
  background:transparent;border:0;border-radius:var(--r-m);color:var(--ink-3);
  font-family:var(--display);font-size:10px;letter-spacing:.05em;text-transform:uppercase;
}
.tab svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink);background:var(--surface-2)}
.tab .dot{width:5px;height:5px;border-radius:50%;background:var(--red);position:absolute;margin:-6px 0 0 20px}

/* ---------- timer tab ---------- */
.clock{
  text-align:center;padding:22px 16px 20px;
  background:var(--ink);color:var(--paper);border-radius:var(--r-l);box-shadow:var(--shadow-2);
}
.clock .big{
  font-family:var(--display);font-weight:500;font-size:clamp(62px,21vw,104px);line-height:.92;
  font-variant-numeric:tabular-nums;letter-spacing:-.01em;
}
.clock .big.warn{color:var(--amber)}
.clock .cap{font-family:var(--display);font-size:11px;letter-spacing:.18em;text-transform:uppercase;opacity:.6;margin-bottom:6px}
.clock .phase{font-family:var(--display);font-size:13px;letter-spacing:.1em;text-transform:uppercase;margin-top:4px;opacity:.8}
.progress{height:3px;background:rgba(255,255,255,.18);border-radius:2px;margin:14px 0 0;overflow:hidden}
.progress i{display:block;height:100%;background:var(--paper);width:0%;transition:width .2s linear}
.presets{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.preset{
  padding:11px 4px;border-radius:var(--r-m);border:1px solid var(--line-2);background:var(--surface);
  font-family:var(--mono);font-size:14px;font-weight:500;box-shadow:var(--shadow-1);
}
.preset:hover{border-color:var(--ink-3)}
.preset small{display:block;font-family:var(--display);font-size:9.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);margin-top:1px}
.seg{display:flex;gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r-m);overflow:hidden}
.seg button{
  flex:1;padding:8px 6px;background:var(--surface);border:0;color:var(--ink-3);
  font-family:var(--display);font-size:12.5px;letter-spacing:.08em;text-transform:uppercase;
}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}

/* ---------- forms ---------- */
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-family:var(--display);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.control{
  width:100%;padding:10px 11px;background:var(--paper);
  border:1px solid var(--line-2);border-radius:var(--r-s);font-size:15.5px;
}
.control:focus{border-color:var(--blue);outline:none;box-shadow:0 0 0 3px color-mix(in srgb,var(--blue) 18%,transparent)}
select.control{appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--ink-3) 50%),linear-gradient(135deg,var(--ink-3) 50%,transparent 50%);background-position:calc(100% - 17px) 50%,calc(100% - 12px) 50%;background-size:5px 5px;background-repeat:no-repeat}
textarea.control{font-family:var(--mono);font-size:12px;line-height:1.5;resize:vertical}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.grid-3{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.switch{display:flex;align-items:center;gap:12px;padding:11px 0}
.switch input{width:19px;height:19px;accent-color:var(--blue);flex:none}
.switch .txt{font-size:15px}
.switch .txt small{display:block;color:var(--ink-3);font-size:12.5px;line-height:1.35}

/* ---------- history ---------- */
.sess{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  background:var(--surface);border:1px solid var(--line);border-radius:var(--r-m);
  padding:12px 14px;box-shadow:var(--shadow-1);
}
.sess:hover{border-color:var(--ink-3)}
.sess .date{
  flex:none;width:44px;text-align:center;font-family:var(--display);line-height:1.05;
  padding-right:12px;border-right:1px solid var(--line);
}
.sess .date .d{display:block;font-size:21px}
.sess .date .mo{display:block;font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3)}
.sess .t{display:block;font-family:var(--display);font-size:16px}
.sess .m{display:block;font-size:12.5px;color:var(--ink-2);font-family:var(--mono);margin-top:1px}
.kv{display:flex;justify-content:space-between;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:14.5px}
.kv:first-child{border-top:0}
.kv .k{color:var(--ink-2)}
.kv .v{font-family:var(--mono);font-variant-numeric:tabular-nums}
.empty{text-align:center;padding:34px 18px;color:var(--ink-2)}
.empty h3{font-size:19px;margin-bottom:6px;color:var(--ink)}
.empty p{margin:0 auto;max-width:44ch;font-size:14.5px}
.chip{
  display:inline-flex;align-items:center;gap:5px;padding:2px 8px;border-radius:999px;
  background:var(--surface-2);color:var(--ink-2);
  font-family:var(--display);font-size:11px;letter-spacing:.09em;text-transform:uppercase;
}
.chip.live{background:var(--red-wash);color:var(--red)}
.chart-box{overflow-x:auto}
svg.chart{width:100%;height:auto;display:block;min-width:280px}

/* ---------- sheet ---------- */
.scrim{position:fixed;inset:0;z-index:60;background:rgba(10,11,14,.5);display:flex;align-items:flex-end;justify-content:center}
.sheet{
  width:100%;max-width:520px;background:var(--surface);
  border:1px solid var(--line);border-bottom:0;
  border-radius:var(--r-l) var(--r-l) 0 0;box-shadow:var(--shadow-2);
  padding:16px 16px calc(18px + env(safe-area-inset-bottom,0px));
  max-height:86vh;overflow-y:auto;
}
.sheet h3{font-size:19px;margin-bottom:12px}
.sheet-list{display:grid;gap:8px}
.plates{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.plate{
  padding:5px 10px;border-radius:var(--r-s);font-family:var(--mono);font-size:13px;font-weight:600;
  color:#fff;background:var(--ink-2);
}
/* ---------- records, milestones, goals ---------- */
.bar-track{height:9px;border-radius:5px;background:var(--surface-2);border:1px solid var(--line);overflow:hidden}
.bar-fill{height:100%;background:var(--blue);border-radius:4px;transition:width .3s ease}
.bar-fill.done{background:var(--green)}
.ms{display:grid;gap:8px;padding:13px 14px}
.ms-top{display:flex;align-items:baseline;gap:10px}
.ms-top .n{font-family:var(--display);font-size:16.5px;line-height:1.2}
.ms-top .v{
  margin-left:auto;flex:none;font-family:var(--mono);font-size:13.5px;font-weight:500;
  font-variant-numeric:tabular-nums;
}
.ms-note{font-size:12.5px;color:var(--ink-2);line-height:1.4}
.rec{
  display:block;width:100%;text-align:left;background:transparent;
  border:0;border-top:1px solid var(--line);padding:11px 14px;
}
.card > .rec:first-child{border-top:0}
.rec:hover{background:var(--surface-2)}
.btn-link{
  background:none;border:0;padding:0;color:var(--blue);
  font-family:inherit;font-size:12.5px;text-decoration:underline;
}
@media (prefers-reduced-motion:reduce){ .bar-fill{transition:none} }

/* ---------- daily check-in ---------- */
.quick{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip-x{
  display:inline-flex;align-items:center;gap:7px;padding:5px 10px;border-radius:999px;
  background:var(--surface-2);border:1px solid var(--line);color:var(--ink);
  font-family:var(--mono);font-size:12.5px;
}
.chip-x:hover{border-color:var(--red);color:var(--red)}
.chip-x b{font-weight:600}
.chip-x span{font-size:15px;line-height:1;color:var(--ink-3)}
.chip-x:hover span{color:var(--red)}
.dots{display:flex;gap:4px}
.dot14{
  flex:1;height:16px;border-radius:4px;
  background:var(--surface-2);border:1px solid var(--line);
}
.dot14.on{background:var(--green);border-color:var(--green)}

/* ---------- form guide ---------- */
.demo{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r-m);padding:4px}
.demo svg{width:100%;height:auto;display:block}
.cues{list-style:none;margin:14px 0 0;padding:0;display:grid;gap:9px}
.cues li{display:flex;gap:10px;font-size:14.5px;line-height:1.45}
.cues li::before{
  content:"";flex:none;width:7px;height:7px;border-radius:50%;
  background:var(--green);margin-top:7px;
}
.miss{margin-top:14px;padding:11px 13px;border-radius:var(--r-m);background:var(--red-wash);font-size:14px;line-height:1.45}
.miss b{
  display:block;margin-bottom:3px;color:var(--red);
  font-family:var(--display);font-size:10.5px;font-weight:500;letter-spacing:.13em;text-transform:uppercase;
}
a.btn{text-decoration:none}
.toast{
  position:fixed;left:50%;transform:translateX(-50%);bottom:calc(152px + env(safe-area-inset-bottom,0px));
  z-index:70;background:var(--ink);color:var(--paper);
  padding:10px 16px;border-radius:999px;box-shadow:var(--shadow-2);
  font-size:14px;max-width:calc(100% - 32px);text-align:center;
}
@media (prefers-reduced-motion:no-preference){
  .toast{animation:pop .22s ease-out}
  @keyframes pop{from{opacity:0;transform:translate(-50%,8px)}to{opacity:1;transform:translate(-50%,0)}}
}
@media (min-width:640px){
  .view-title{font-size:30px}
  .grid-cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}
}

<script>
"use strict";
/* =====================================================================
   LIFT LEDGER - a single-file training log with the clock built in.
   Data lives in this browser (localStorage). Back it up from
   Settings > Data with Copy, and paste it back on another device.
   ===================================================================== */

/* ------------------------------ storage ---------------------------- */
var APP_BUILD = 6;
var APP_DATE = "17 Sep 2026";
var KEY = "liftledger.v1";
var S = null;

function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2, 7); }

function defaults(){
  return {
    v: 1,
    settings: { unit:"lb", bar:45, rest:120, sound:true, vibrate:true, wake:true, theme:"system" },
    routines: seedRoutines(),
    sessions: [],
    goals: [],
    body: { goalW:0, pTarget:150, w:{}, p:{}, c:{} },
    active: null
  };
}

function seedRoutines(){
  function ex(name, sets, reps, rest){ return { id:uid(), name:name, sets:sets, reps:reps, rest:rest }; }
  return [
    { id:uid(), name:"Push - Mon & Thu", color:"red", exercises:[
      ex("Barbell Bench Press", 4, "6-8", 180),
      ex("Overhead Press", 3, "8-10", 150),
      ex("Incline Dumbbell Press", 3, "10", 120),
      ex("Cable Triceps Pushdown", 3, "12", 60),
      ex("Lateral Raise", 3, "15", 45)
    ]},
    { id:uid(), name:"Pull - Tue & Fri", color:"blue", exercises:[
      ex("Cable Lat Pulldown", 4, "8-10", 120),
      ex("Barbell Row", 3, "8-10", 150),
      ex("Seated Cable Row", 3, "10", 120),
      ex("Dumbbell Curl", 3, "12", 60),
      ex("Face Pull", 3, "15", 45)
    ]},
    { id:uid(), name:"Legs - Wed & Sat", color:"green", exercises:[
      ex("Barbell Squat", 3, "8", 180),
      ex("Dumbbell Romanian Deadlift", 2, "10", 150),
      ex("Leg Curl or Glute Bridge", 2, "12", 90)
    ]}
  ];
}

/* Names of the very first seed, so an untouched copy of it can be
   swapped for the current one without ever clobbering real edits. */
var OLD_SEED = ["upper a - press & pull", "lower a - squat", "upper b - volume", "lower b - deadlift"];
function isUntouchedOldSeed(p){
  if (p.sessions.length || p.active) return false;
  if (p.routines.length !== OLD_SEED.length) return false;
  return p.routines.every(function(r){ return OLD_SEED.indexOf(norm(r.name)) !== -1; });
}

function load(){
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) {
      var p = JSON.parse(raw);
      var d = defaults();
      p.settings = Object.assign(d.settings, p.settings || {});
      if (!Array.isArray(p.routines)) p.routines = d.routines;
      if (!Array.isArray(p.sessions)) p.sessions = [];
      if (!Array.isArray(p.goals)) p.goals = [];
      p.body = Object.assign(d.body, p.body || {});
      ["w", "p", "c"].forEach(function(f){ if (!p.body[f] || typeof p.body[f] !== "object") p.body[f] = {}; });
      if (!p.active) p.active = null;
      if (isUntouchedOldSeed(p)) p.routines = d.routines;
      return p;
    }
  } catch (e) {}
  return defaults();
}

var saveWarned = false;
function save(){
  try { localStorage.setItem(KEY, JSON.stringify(S)); }
  catch (e) {
    if (!saveWarned) { saveWarned = true; toast("This browser is blocking storage, so nothing is being saved."); }
  }
}

/* ------------------------------ helpers ---------------------------- */
function $(sel, root){ return (root || document).querySelector(sel); }
function esc(s){
  return String(s == null ? "" : s).replace(/[&<>"']/g, function(c){
    return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" }[c];
  });
}
function num(v){ var n = parseFloat(v); return isFinite(n) ? n : 0; }
function fmt(n){
  if (!isFinite(n)) return "0";
  return (Math.round(n * 100) / 100).toString();
}
function unit(){ return S.settings.unit; }
function norm(name){ return String(name || "").trim().toLowerCase(); }

function clock(sec){
  sec = Math.max(0, Math.round(sec));
  var m = Math.floor(sec / 60), s = sec % 60;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
function dur(ms){
  var sec = Math.max(0, Math.round(ms / 1000));
  var h = Math.floor(sec / 3600), m = Math.floor((sec % 3600) / 60), s = sec % 60;
  if (h) return h + ":" + (m < 10 ? "0" : "") + m + ":" + (s < 10 ? "0" : "") + s;
  return m + ":" + (s < 10 ? "0" : "") + s;
}
var MONTHS = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
function dayLabel(ts){
  var d = new Date(ts);
  return MONTHS[d.getMonth()] + " " + d.getDate();
}
function ago(ts){
  var days = Math.floor((Date.now() - ts) / 86400000);
  if (days <= 0) return "today";
  if (days === 1) return "yesterday";
  if (days < 30) return days + " days ago";
  var mo = Math.round(days / 30);
  return mo + (mo === 1 ? " month ago" : " months ago");
}
function toast(msg){
  var t = $("#toast");
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toast._t);
  toast._t = setTimeout(function(){ t.hidden = true; }, 2600);
}

/* --------------------------- training math -------------------------- */
/* Epley estimated one-rep max - the standard back-of-the-notebook formula. */
function e1rm(w, r){
  w = num(w); r = num(r);
  if (w <= 0 || r <= 0) return 0;
  if (r === 1) return w;
  return w * (1 + r / 30);
}
function doneSets(entry){
  return (entry.sets || []).filter(function(s){ return s.done; });
}
function sessionVolume(sess){
  var v = 0;
  (sess.entries || []).forEach(function(e){
    doneSets(e).forEach(function(s){ v += num(s.w) * num(s.r); });
  });
  return v;
}
function sessionSetCount(sess){
  var n = 0;
  (sess.entries || []).forEach(function(e){ n += doneSets(e).length; });
  return n;
}
function finishedSessions(){
  return S.sessions.slice().sort(function(a, b){ return b.start - a.start; });
}
/* Best estimated 1RM ever recorded for an exercise, from finished sessions. */
function bestE1rm(name){
  var key = norm(name), best = 0;
  S.sessions.forEach(function(sess){
    (sess.entries || []).forEach(function(e){
      if (norm(e.name) !== key) return;
      doneSets(e).forEach(function(s){ best = Math.max(best, e1rm(s.w, s.r)); });
    });
  });
  return best;
}
/* The most recent finished session that actually logged this exercise. */
function lastTime(name){
  var key = norm(name), out = null;
  finishedSessions().some(function(sess){
    return (sess.entries || []).some(function(e){
      if (norm(e.name) !== key) return false;
      var d = doneSets(e);
      if (!d.length) return false;
      out = { date: sess.start, sets: d };
      return true;
    });
  });
  return out;
}
function exerciseNames(){
  var seen = {}, out = [];
  function add(n){ var k = norm(n); if (k && !seen[k]) { seen[k] = 1; out.push(n); } }
  S.routines.forEach(function(r){ r.exercises.forEach(function(e){ add(e.name); }); });
  S.sessions.forEach(function(s){ (s.entries || []).forEach(function(e){ add(e.name); }); });
  out.sort(function(a, b){ return a.localeCompare(b); });
  return out;
}
/* Plates per side, heaviest first, for a loaded barbell. */
function plateMath(total, bar){
  var sizes = unit() === "kg" ? [25, 20, 15, 10, 5, 2.5, 1.25] : [45, 35, 25, 10, 5, 2.5];
  var perSide = (num(total) - num(bar)) / 2;
  if (perSide <= 0) return { ok: false, perSide: perSide, plates: [] };
  var left = perSide, plates = [];
  sizes.forEach(function(p){
    while (left >= p - 0.001) { plates.push(p); left -= p; }
  });
  return { ok: true, perSide: perSide, plates: plates, leftover: Math.round(left * 100) / 100 };
}

/* ------------------------------ sound ------------------------------- */
var ac = null;
function audioReady(){
  try {
    if (!ac) { var AC = window.AudioContext || window.webkitAudioContext; if (AC) ac = new AC(); }
    if (ac && ac.state === "suspended") ac.resume();
  } catch (e) {}
}
function beep(freq, len, vol){
  if (!S.settings.sound || !ac) return;
  try {
    var o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime;
    o.type = "sine"; o.frequency.value = freq || 880;
    o.connect(g); g.connect(ac.destination);
    g.gain.setValueAtTime(0.0001, t);
    g.gain.exponentialRampToValueAtTime(vol || 0.25, t + 0.012);
    g.gain.exponentialRampToValueAtTime(0.0001, t + (len || 0.14));
    o.start(t); o.stop(t + (len || 0.14) + 0.03);
  } catch (e) {}
}
function buzz(pattern){
  if (!S.settings.vibrate) return;
  try { if (navigator.vibrate) navigator.vibrate(pattern); } catch (e) {}
}
function alarm(){
  beep(880, 0.16, 0.3);
  setTimeout(function(){ beep(1175, 0.16, 0.3); }, 190);
  setTimeout(function(){ beep(1568, 0.3, 0.3); }, 380);
  buzz([180, 90, 180, 90, 260]);
}

/* ------------------------------ timers ------------------------------ */
/* Countdowns are stored as an end timestamp, so a locked screen or a
   backgrounded tab never drifts - we always recompute from the clock. */
var T = {
  mode: "rest",            /* rest | interval */
  running: false,
  endsAt: 0,
  total: 120,
  paused: 0,               /* seconds left while paused */
  label: "Rest",
  lastWhole: -1,
  iv: { work: 40, rest: 20, rounds: 8, round: 1, phase: "work" }
};
var SW = { running: false, start: 0, acc: 0 };

function restRemaining(){
  if (!T.running) return T.paused;
  return Math.max(0, (T.endsAt - Date.now()) / 1000);
}
function startRest(seconds, label){
  audioReady();
  T.mode = "rest";
  T.total = Math.max(1, Math.round(seconds));
  T.endsAt = Date.now() + T.total * 1000;
  T.running = true;
  T.paused = 0;
  T.label = label || "Rest";
  T.lastWhole = -1;
  requestWakeLock();
  paintTimer();
}
function stopTimer(){
  T.running = false;
  T.paused = 0;
  paintTimer();
}
function pauseTimer(){
  if (!T.running) return;
  T.paused = restRemaining();
  T.running = false;
  paintTimer();
}
function resumeTimer(){
  if (T.running || T.paused <= 0) return;
  audioReady();
  T.endsAt = Date.now() + T.paused * 1000;
  T.running = true;
  T.paused = 0;
  paintTimer();
}
function nudgeTimer(sec){
  if (T.running) {
    T.endsAt = Math.max(Date.now(), T.endsAt + sec * 1000);
    T.total = Math.max(T.total, Math.ceil((T.endsAt - Date.now()) / 1000));
  } else if (T.paused > 0) {
    T.paused = Math.max(0, T.paused + sec);
  } else {
    T.total = Math.max(5, T.total + sec);
  }
  paintTimer();
}
function startInterval(){
  audioReady();
  T.mode = "interval";
  T.iv.round = 1;
  T.iv.phase = "work";
  T.total = Math.max(1, T.iv.work);
  T.endsAt = Date.now() + T.total * 1000;
  T.running = true;
  T.paused = 0;
  T.label = "Work";
  T.lastWhole = -1;
  requestWakeLock();
  paintTimer();
}
function intervalAdvance(){
  var iv = T.iv;
  if (iv.phase === "work") {
    if (iv.rest > 0 && iv.round <= iv.rounds) {
      iv.phase = "rest";
      T.total = iv.rest;
      T.label = "Rest";
    } else {
      iv.round++;
      if (iv.round > iv.rounds) return finishInterval();
      T.total = iv.work; T.label = "Work";
    }
  } else {
    iv.round++;
    if (iv.round > iv.rounds) return finishInterval();
    iv.phase = "work";
    T.total = iv.work;
    T.label = "Work";
  }
  T.endsAt = Date.now() + T.total * 1000;
  T.lastWhole = -1;
  beep(iv.phase === "work" ? 1320 : 660, 0.16, 0.28);
  buzz(120);
}
function finishInterval(){
  T.running = false;
  T.paused = 0;
  T.label = "Done";
  alarm();
  toast("Intervals finished - " + T.iv.rounds + " rounds.");
}

/* Keep the screen on while something is actually running. */
var wakeLock = null;
function requestWakeLock(){
  if (!S.settings.wake || !navigator.wakeLock) return;
  try {
    navigator.wakeLock.request("screen").then(function(l){
      wakeLock = l;
      l.addEventListener("release", function(){ wakeLock = null; });
    }).catch(function(){});
  } catch (e) {}
}
function releaseWakeLock(){
  try { if (wakeLock) { wakeLock.release(); wakeLock = null; } } catch (e) {}
}

/* One ticker drives every clock on screen. It only writes text nodes,
   so it never blows away a number you are halfway through typing. */
function tick(){
  if (T.running) {
    var left = restRemaining();
    var whole = Math.ceil(left);
    if (whole !== T.lastWhole) {
      T.lastWhole = whole;
      if (whole > 0 && whole <= 3) { beep(660, 0.09, 0.2); buzz(45); }
    }
    if (left <= 0) {
      if (T.mode === "interval") { intervalAdvance(); }
      else {
        T.running = false;
        T.paused = 0;
        alarm();
        releaseWakeLock();
      }
    }
  }
  paintTimer();
  paintSessionClock();
}

/* ------------------------------ ui state ---------------------------- */
var V = { view:"train", logTab:"sessions", sessionId:null, exName:null, routineId:null, body:false };

var ICON_CHECK = '<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg>';

function go(view){
  V.view = view;
  if (view !== "log") { V.sessionId = null; V.exName = null; }
  if (view !== "plan") { V.routineId = null; }
  if (view !== "goals") { V.body = false; }
  render();
  window.scrollTo(0, 0);
}

/* ------------------------------ render ------------------------------ */
function render(){
  var m = $("#main");
  var html = "";
  if (V.view === "train") html = viewTrain();
  else if (V.view === "timer") html = viewTimer();
  else if (V.view === "log") html = viewLog();
  else if (V.view === "goals") html = V.body ? viewBody() : viewGoals();
  else if (V.view === "plan") html = viewPlan();
  else if (V.view === "settings") html = viewSettings();
  m.innerHTML = html;

  var tabs = document.querySelectorAll(".tab");
  for (var i = 0; i < tabs.length; i++) {
    var on = tabs[i].getAttribute("data-view") === V.view;
    if (on) tabs[i].setAttribute("aria-current", "page");
    else tabs[i].removeAttribute("aria-current");
  }
  $("#liveChip").hidden = !S.active;
  $("#exerciseNames").innerHTML = exerciseNames().map(function(n){
    return '<option value="' + esc(n) + '"></option>';
  }).join("");
  paintTimer();
  paintSessionClock();
}

/* ------------------------------ TRAIN ------------------------------- */
function viewTrain(){
  return S.active ? trainActive() : trainPicker();
}

function trainPicker(){
  var last = finishedSessions()[0];
  var h = '<div class="stack">';
  h += '<div><p class="eyebrow">Train</p><h1 class="view-title">Pick today\'s session</h1>' +
       '<p class="sub">' + (last
          ? 'Last session: ' + esc(last.name) + ', ' + ago(last.start) + '.'
          : 'Nothing logged yet. Start with a routine or an empty session.') +
       '</p></div>';
  h += '<div class="pick">';
  S.routines.forEach(function(r){
    var setCount = r.exercises.reduce(function(a, e){ return a + num(e.sets); }, 0);
    var mins = Math.round(r.exercises.reduce(function(a, e){
      return a + num(e.sets) * (num(e.rest) + 35);
    }, 0) / 60);
    var done = null;
    finishedSessions().some(function(s){ if (s.routineId === r.id) { done = s; return true; } return false; });
    h += '<button class="pick-item" data-action="start-routine" data-id="' + r.id + '">' +
           '<span class="bar" style="background:var(--' + (r.color || "red") + ')"></span>' +
           '<span><span class="t">' + esc(r.name) + '</span>' +
           '<span class="m">' + r.exercises.length + ' lifts &middot; ' + setCount + ' sets &middot; ~' + mins + ' min' +
           (done ? ' &middot; ' + ago(done.start) : '') + '</span></span>' +

  });

  h += '</div>';
  return h;
}

function trainActive(){

  h += '<div class="stats">' +
         '<div class="stat"><div class="k">Elapsed</div><div class="v" id="elapsed">0:00</div></div>' +
         '<div class="stat"><div class="k">Volume</div><div class="v">' + fmt(sessionVolume(a)) + '<small>' + unit() + '</small></div></div>' +
         '<div class="stat"><div class="k">Sets</div><div class="v">' + sessionSetCount(a) + '</div></div>' +

function exerciseCard(e){
  var best = bestE1rm(e.name);
  var prev = lastTime(e.name);
  var d = doneSets(e);
  var complete = d.length >= num(e.target) && d.length > 0;

  var h = '<section class="ex' + (complete ? ' complete' : '') + '" data-ex="' + e.id + '">';
  h += '<div class="ex-head"><div style="min-width:0">' +
         '<h3>' + esc(e.name) + '</h3>' +
         '<div class="ex-meta">' + num(e.target) + ' x ' + esc(e.reps) + ' &middot; rest ' + clock(num(e.rest)) +
         (best > 0 ? ' &middot; best e1RM ' + fmt(Math.round(best)) + unit() : '') +
         '</div></div>' +
         '<button class="icon-btn pull-right" data-action="ex-menu" data-ex="' + e.id + '" aria-label="Options for ' + esc(e.name) + '">' +
           '<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1.3"></circle><circle cx="12" cy="12" r="1.3"></circle><circle cx="19" cy="12" r="1.3"></circle></svg>' +
         '</button></div>';

  if (prev) {
    h += '<div class="ex-last">' + dayLabel(prev.date) + ': ' +
         prev.sets.map(function(s){ return '<b>' + fmt(s.w) + '</b>x' + fmt(s.r); }).join(" &middot; ") +
         '</div>';
  }

  h += '<table class="sets"><thead><tr><th>Set</th><th>' + unit() + '</th><th>Reps</th><th></th></tr></thead><tbody>';
  e.sets.forEach(function(s, i){
    var ph = prev && prev.sets[i] ? fmt(prev.sets[i].w) : (prev && prev.sets.length ? fmt(prev.sets[prev.sets.length - 1].w) : "");
    var phr = prev && prev.sets[i] ? fmt(prev.sets[i].r) : esc(e.reps);
    h += '<tr class="' + (s.done ? "done" : "") + '" data-ex="' + e.id + '" data-i="' + i + '">' +
           '<td class="setno">' + (i + 1) + (s.pr ? '<span class="pr">PR</span>' : '') + '</td>' +
           '<td><input class="inp" data-f="w" data-ex="' + e.id + '" data-i="' + i + '" inputmode="decimal" ' +
             'aria-label="Weight, set ' + (i + 1) + '" value="' + esc(s.w === "" || s.w == null ? "" : s.w) + '" placeholder="' + esc(ph) + '"></td>' +
           '<td><input class="inp" data-f="r" data-ex="' + e.id + '" data-i="' + i + '" inputmode="numeric" ' +
             'aria-label="Reps, set ' + (i + 1) + '" value="' + esc(s.r === "" || s.r == null ? "" : s.r) + '" placeholder="' + esc(phr) + '"></td>' +
           '<td><button class="check" data-action="log-set" data-ex="' + e.id + '" data-i="' + i + '" ' +
             'aria-label="' + (s.done ? "Undo set " : "Log set ") + (i + 1) + '">' + ICON_CHECK + '</button></td>' +
         '</tr>';
  });
  h += '</tbody></table>';
  h += '<div class="ex-actions">' +
         '<button class="btn btn-ghost btn-sm" data-action="add-set" data-ex="' + e.id + '">+ Set</button>' +
         '<button class="btn btn-ghost btn-sm" data-action="form-sheet" data-name="' + esc(e.name) + '">Form</button>' +
         '<button class="btn btn-ghost btn-sm" data-action="plate-sheet" data-ex="' + e.id + '">Plates</button>' +
         '<button class="btn btn-ghost btn-sm" data-action="rest-now" data-ex="' + e.id + '">Rest ' + clock(num(e.rest)) + '</button>' +
       '</div>';
  h += '</section>';
  return h;
}

/* ------------------------------- LOG -------------------------------- */
function viewLog(){
  if (V.sessionId) return sessionDetail(V.sessionId);
  if (V.exName) return exerciseDetail(V.exName);

  var h = '<div class="stack">';
  h += '<div><p class="eyebrow">Log</p><h1 class="view-title">What you have lifted</h1></div>';
  h += '<div class="seg" role="group" aria-label="Log view">' +
         '<button data-action="log-tab" data-tab="sessions" aria-pressed="' + (V.logTab === "sessions") + '">Sessions</button>' +
         '<button data-action="log-tab" data-tab="exercises" aria-pressed="' + (V.logTab === "exercises") + '">Lifts</button>' +
       '</div>';

  var list = finishedSessions();
  if (!list.length) {
    h += '<div class="card empty"><h3>The ledger is empty</h3>' +
         '<p>Finish a session and it lands here with its date, working time, total volume and every set you hit.</p></div>';
    return h + '</div>';
  }

  if (V.logTab === "sessions") {
    var vol = list.reduce(function(a, s){ return a + sessionVolume(s); }, 0);
    h += '<div class="stats">' +
           '<div class="stat"><div class="k">Sessions</div><div class="v">' + list.length + '</div></div>' +
           '<div class="stat"><div class="k">Sets</div><div class="v">' + list.reduce(function(a, s){ return a + sessionSetCount(s); }, 0) + '</div></div>' +
           '<div class="stat"><div class="k">Volume</div><div class="v">' + Math.round(vol / 1000) + '<small>k ' + unit() + '</small></div></div>' +
         '</div>';
    list.forEach(function(s){
      var d = new Date(s.start);
      h += '<button class="sess" data-action="open-session" data-id="' + s.id + '">' +
             '<span class="date"><span class="d">' + d.getDate() + '</span><span class="mo">' + MONTHS[d.getMonth()] + '</span></span>' +
             '<span style="min-width:0"><span class="t">' + esc(s.name) + '</span>' +
             '<span class="m">' + sessionSetCount(s) + ' sets &middot; ' + fmt(Math.round(sessionVolume(s))) + ' ' + unit() +
             ' &middot; ' + dur((s.end || s.start) - s.start) + '</span></span>' +
           '</button>';
    });
  } else {
    var names = {};
    list.forEach(function(s){
      (s.entries || []).forEach(function(e){
        var d = doneSets(e);
        if (!d.length) return;
        var k = norm(e.name);
        if (!names[k]) names[k] = { name: e.name, sets: 0, last: 0, best: 0 };
        names[k].sets += d.length;
        names[k].last = Math.max(names[k].last, s.start);
        d.forEach(function(x){ names[k].best = Math.max(names[k].best, e1rm(x.w, x.r)); });
      });
    });
    var arr = Object.keys(names).map(function(k){ return names[k]; })
      .sort(function(a, b){ return b.last - a.last; });
    if (!arr.length) {
      h += '<div class="card empty"><h3>No completed sets yet</h3><p>Tick a set off during a session and the lift shows up here.</p></div>';
    }
    arr.forEach(function(x){
      h += '<button class="sess" data-action="open-exercise" data-name="' + esc(x.name) + '">' +
             '<span style="min-width:0"><span class="t">' + esc(x.name) + '</span>' +
             '<span class="m">' + x.sets + ' sets &middot; best e1RM ' + fmt(Math.round(x.best)) + ' ' + unit() + ' &middot; ' + ago(x.last) + '</span></span>' +
             '<span class="go pull-right" style="color:var(--ink-3);font-family:var(--display);font-size:13px">&rarr;</span>' +
           '</button>';
    });
  }
  h += '</div>';
  return h;
}

function exerciseDetail(name){
  var key = norm(name), pts = [], best = 0, bestSet = null, totalSets = 0;
  finishedSessions().slice().reverse().forEach(function(s){
    (s.entries || []).forEach(function(e){
      if (norm(e.name) !== key) return;
      var d = doneSets(e);
      if (!d.length) return;
      totalSets += d.length;
      var top = 0, topSet = null;
      d.forEach(function(x){
        var v = e1rm(x.w, x.r);
        if (v > top) { top = v; topSet = x; }
        if (v > best) { best = v; bestSet = x; }
      });
      pts.push({ t: s.start, v: top, set: topSet });
    });
  });

  var h = '<div class="stack">';
  h += '<button class="btn btn-ghost btn-sm" data-action="back-log" style="align-self:flex-start">&larr; All lifts</button>';
  h += '<div><p class="eyebrow">Lift</p><h1 class="view-title">' + esc(name) + '</h1>' +
       '<p class="sub">Estimated one-rep max per session, using the Epley formula on your best set of the day.</p></div>';
  h += '<div class="stats">' +
         '<div class="stat"><div class="k">Best e1RM</div><div class="v">' + fmt(Math.round(best)) + '<small>' + unit() + '</small></div></div>' +
         '<div class="stat"><div class="k">From</div><div class="v" style="font-size:16px">' + (bestSet ? fmt(bestSet.w) + "x" + fmt(bestSet.r) : "-") + '</div></div>' +
         '<div class="stat"><div class="k">Sets</div><div class="v">' + totalSets + '</div></div>' +
       '</div>';
  h += '<div class="card card-pad"><div class="chart-box">' + buildChart(pts) + '</div></div>';
  h += '<div class="card card-pad"><p class="eyebrow" style="margin-bottom:6px">Session by session</p>';
  pts.slice().reverse().forEach(function(p){
    h += '<div class="kv"><span class="k">' + dayLabel(p.t) + '</span>' +
         '<span class="v">' + fmt(p.set.w) + ' x ' + fmt(p.set.r) + '  <span style="color:var(--ink-3)">= ' + fmt(Math.round(p.v)) + '</span></span></div>';
  });
  h += '</div></div>';
  return h;
}

/* A small line chart drawn to one scale, with room in the viewBox for
   the outermost labels. */
function buildChart(pts){
  if (pts.length < 2) {
    return '<p class="sub" style="margin:8px 0">Log this lift in two or more sessions and the trend line appears here.</p>';
  }
  var W = 640, H = 250, L = 56, R = 16, TP = 18, B = 34;
  var vals = pts.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { hi = lo + 1; lo = Math.max(0, lo - 1); }
  var pad = (hi - lo) * 0.18;
  hi += pad; lo = Math.max(0, lo - pad);
  function X(i){ return L + (W - L - R) * (i / (pts.length - 1)); }
  function Y(v){ return TP + (H - TP - B) * (1 - (v - lo) / (hi - lo)); }

  var g = "";
  for (var k = 0; k <= 3; k++) {
    var v = lo + (hi - lo) * k / 3, y = Y(v);
    g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) +
         '" stroke="currentColor" stroke-width="1" opacity="0.16"></line>';
    g += '<text x="' + (L - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="12" ' +
         'font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + Math.round(v) + '</text>';
  }
  var line = pts.map(function(p, i){ return (i ? "L" : "M") + X(i).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
  var area = line + " L" + X(pts.length - 1).toFixed(1) + " " + (H - B) + " L" + X(0).toFixed(1) + " " + (H - B) + " Z";

  var dots = pts.map(function(p, i){
    var lastOne = i === pts.length - 1;
    return '<circle cx="' + X(i).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) + '" r="' + (lastOne ? 5.5 : 3.2) + '" ' +
           'fill="' + (lastOne ? "var(--red)" : "var(--blue)") + '" stroke="var(--surface)" stroke-width="' + (lastOne ? 2.5 : 1.5) + '"></circle>';
  }).join("");

  var xl = '<text x="' + L + '" y="' + (H - 10) + '" font-size="12" font-family="IBM Plex Mono, monospace" ' +
           'fill="currentColor" opacity="0.6">' + dayLabel(pts[0].t) + '</text>' +
           '<text x="' + (W - R) + '" y="' + (H - 10) + '" text-anchor="end" font-size="12" ' +
           'font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + dayLabel(pts[pts.length - 1].t) + '</text>';

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
         'aria-label="Estimated one-rep max over ' + pts.length + ' sessions" style="color:var(--ink-2)">' +
         '<defs><linearGradient id="fadeFill" x1="0" y1="0" x2="0" y2="1">' +
           '<stop offset="0%" stop-color="var(--blue)" stop-opacity="0.28"></stop>' +
           '<stop offset="100%" stop-color="var(--blue)" stop-opacity="0"></stop>' +
         '</linearGradient></defs>' +
         g +
         '<path d="' + area + '" fill="url(#fadeFill)" stroke="none"></path>' +
         '<path d="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"></path>' +
         dots + xl +
         '</svg>';
}

/* Each lift uses a different slice of the coordinate space - a squat is
   tall, a bench press is wide and low - so the viewBox is fitted to the
   drawing instead of leaving half the card empty. */
function guideBox(g){
  var xs = [], ys = [], p = g.props || {}, j;
  ["a", "b"].forEach(function(k){
    var P = g[k] || {};
    for (j in P) { xs.push(P[j][0]); ys.push(P[j][1]); }
  });
  if (p.floor || p.bench || p.incline || p.pad || p.seat) ys.push(186);
  if (p.bench) { xs.push(58, 188); }
  if (p.pad) { xs.push(56, 178); }
  if (p.incline) { xs.push(86, 168); }
  if (p.seat) { xs.push(74, 128); }
  if (p.seatLine) { xs.push(64, 132); }
  if (p.footPlate) { xs.push(170); ys.push(182); }
  if (p.column) { xs.push(p.column); ys.push(p.pulleyY || 36, 186); }
  if (p.lowPulley) { xs.push(p.lowPulley[0]); ys.push(p.lowPulley[1]); }
  if (g.mirror) {
    var cx = g.cx || 110, n = xs.length;
    for (j = 0; j < n; j++) xs.push(2 * cx - xs[j]);
  }
  var pad = 24;
  var x0 = Math.min.apply(null, xs) - pad, x1 = Math.max.apply(null, xs) + pad;
  var y0 = Math.min.apply(null, ys) - pad, y1 = Math.max.apply(null, ys) + pad;
  var w = x1 - x0, h = y1 - y0;
  var minW = h * 1.25;                 /* keep the card a comfortable landscape */
  if (w < minW) { var d = (minW - w) / 2; x0 -= d; w = minW; }
  return [Math.round(x0), Math.round(y0), Math.round(w), Math.round(h)].join(" ");
}

function matchGuide(name){
  var n = " " + norm(name).replace(/[^a-z0-9]+/g, " ") + " ";
  for (var i = 0; i < GUIDES.length; i++) {
    var g = GUIDES[i], bad = false;
    if (g.avoid) {
      for (var k = 0; k < g.avoid.length; k++) if (n.indexOf(g.avoid[k]) >= 0) bad = true;
    }
    if (bad) continue;
    for (var j = 0; j < g.match.length; j++) if (n.indexOf(g.match[j]) >= 0) return g;
  }
  return null;
}

/* ---------------------------- drawing ------------------------------- */
function lerp(a, b, t){ return a + (b - a) * t; }
function lerpPt(A, B, t){ return [lerp(A[0], B[0], t), lerp(A[1], B[1], t)]; }

function seg(a, b, w, color, op){
  return '<line x1="' + a[0].toFixed(1) + '" y1="' + a[1].toFixed(1) +
         '" x2="' + b[0].toFixed(1) + '" y2="' + b[1].toFixed(1) +
         '" stroke="' + color + '" stroke-width="' + w + '" stroke-linecap="round"' +
         (op ? ' opacity="' + op + '"' : "") + '></line>';
}
function propsMarkup(g){
  var p = g.props || {}, s = "", edge = "var(--ink-3)";
  if (p.floor) s += seg([12, 186], [228, 186], 3, "var(--line-2)");
  if (p.bench) {
    s += '<rect x="58" y="128" width="130" height="12" rx="5" fill="none" stroke="' + edge + '" stroke-width="3"></rect>';
    s += seg([74, 140], [74, 186], 3, edge) + seg([172, 140], [172, 186], 3, edge);
  }
  if (p.incline) {
    s += seg([136, 160], [86, 110], 11, "var(--surface)") + seg([136, 160], [86, 110], 3, edge);
    s += seg([136, 160], [168, 160], 3, edge) + seg([140, 160], [140, 186], 3, edge);
  }
  if (p.pad) {
    s += '<rect x="56" y="148" width="122" height="13" rx="6" fill="none" stroke="' + edge + '" stroke-width="3"></rect>';
    s += seg([70, 161], [70, 186], 3, edge) + seg([164, 161], [164, 186], 3, edge);
  }
  if (p.seat) {
    s += '<rect x="74" y="148" width="54" height="10" rx="4" fill="none" stroke="' + edge + '" stroke-width="3"></rect>';
    s += seg([100, 158], [100, 186], 3, edge);
  }
  if (p.seatLine) s += seg([64, 150], [132, 150], 3, edge);
  if (p.footPlate) s += '<rect x="158" y="146" width="12" height="36" rx="3" fill="none" stroke="' + edge + '" stroke-width="3"></rect>';
  if (p.column) {
    var y = p.pulleyY || 36;
    s += seg([p.column, y], [p.column, 186], 3, edge);
    s += '<circle cx="' + p.column + '" cy="' + y + '" r="6" fill="none" stroke="' + edge + '" stroke-width="3"></circle>';
  }
  if (p.lowPulley) {
    s += '<circle cx="' + p.lowPulley[0] + '" cy="' + p.lowPulley[1] + '" r="5" fill="none" stroke="' + edge + '" stroke-width="3"></circle>';
  }
  return s;
}
function bodyMarkup(P, op){
  var ink = "var(--ink)";
  return seg(P.hip, P.kne, 6, ink, op) + seg(P.kne, P.ank, 6, ink, op) +
         seg(P.sho, P.elb, 6, ink, op) + seg(P.elb, P.han, 6, ink, op);
}
function loadMarkup(g, P){
  var h = P.han, red = "var(--red)", blue = "var(--blue)";
  var p = g.props || {};
  var src = p.column ? [p.column, p.pulleyY || 36] : (p.lowPulley || null);
  var s = "";
  if (g.load === "plate") {
    s += '<circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="13" fill="' + red + '"></circle>';
    s += '<circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="4" fill="var(--surface-2)"></circle>';
  } else if (g.load === "db") {
    if (g.view === "front") {
      s += '<rect x="' + (h[0] - 12).toFixed(1) + '" y="' + (h[1] - 5).toFixed(1) + '" width="24" height="10" rx="3" fill="' + red + '"></rect>';
    } else {
      s += '<circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="8" fill="' + red + '"></circle>';
    }
  } else if (g.load === "cable" || g.load === "cablebar") {
    if (src) s += seg(src, h, 2.5, blue);
    if (g.load === "cablebar") s += seg([h[0] - 22, h[1] - 3], [h[0] + 22, h[1] + 3], 5, red);
    else s += '<circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="6" fill="' + red + '"></circle>';
  } else if (g.load === "roller") {
    s += '<circle cx="' + h[0].toFixed(1) + '" cy="' + h[1].toFixed(1) + '" r="0" fill="none"></circle>';
  }
  return s;
}
function figureMarkup(g, t){
  var keys = ["head","sho","elb","han","hip","kne","ank"], P = {}, i;
  for (i = 0; i < keys.length; i++) {
    var k = keys[i];
    P[k] = lerpPt(g.a[k], g.b[k] || g.a[k], t);
  }
  var s = propsMarkup(g);

  /* the far-side arm and leg, faded, so a front view reads as a body */
  if (g.mirror) {
    var M = {}, cx = g.cx || 110;
    for (i = 0; i < keys.length; i++) { var kk = keys[i]; M[kk] = [2 * cx - P[kk][0], P[kk][1]]; }
    s += bodyMarkup(M, 0.4);
    s += loadMarkup(g, M);
  }
  s += seg(P.sho, P.hip, 8, "var(--ink)");
  s += bodyMarkup(P);
  s += '<circle cx="' + P.head[0].toFixed(1) + '" cy="' + P.head[1].toFixed(1) +
       '" r="9.5" fill="var(--surface-2)" stroke="var(--ink)" stroke-width="5"></circle>';

  /* the roller sits on the ankle, not the hand */
  if (g.load === "roller") {
    s += '<circle cx="' + P.ank[0].toFixed(1) + '" cy="' + P.ank[1].toFixed(1) + '" r="9" fill="var(--red)"></circle>';
  } else {
    s += loadMarkup(g, P);
  }
  return s;
}

/* ---------------------------- the sheet ----------------------------- */
var demoRAF = 0, demoGuide = null, demoT0 = 0;

function prefersReduced(){
  try { return window.matchMedia("(prefers-reduced-motion: reduce)").matches; }
  catch (e) { return false; }
}
function demoFrame(){
  var el = document.getElementById("demoSvg");
  if (!el || $("#scrim").hidden || !demoGuide) { demoRAF = 0; return; }
  var period = 2400;
  var ph = ((Date.now() - demoT0) % (period * 2)) / period;
  var t = ph <= 1 ? ph : 2 - ph;
  el.innerHTML = figureMarkup(demoGuide, 0.5 - 0.5 * Math.cos(Math.PI * t));
  demoRAF = requestAnimationFrame(demoFrame);
}
function playDemo(){
  if (!demoGuide) return;
  demoT0 = Date.now();
  cancelAnimationFrame(demoRAF);
  demoRAF = requestAnimationFrame(demoFrame);
}
function stopDemo(){
  cancelAnimationFrame(demoRAF);
  demoRAF = 0;
  demoGuide = null;
}
function formSheet(name){
  var g = matchGuide(name);
  demoGuide = g;
  var search = "https://www.youtube.com/results?search_query=" + encodeURIComponent(name + " proper form");
  var body = "";

  if (g) {
    body += '<div class="demo"><svg id="demoSvg" viewBox="' + guideBox(g) + '" role="img" ' +
            'aria-label="Animated demonstration of the ' + esc(g.title) + '"></svg></div>';
    if (prefersReduced()) {
      body += '<button class="btn btn-sm btn-ghost btn-block" style="margin-top:8px" data-action="demo-play">Play the movement</button>';
    }
    body += '<ul class="cues">';
    g.cues.forEach(function(c){ body += '<li><span>' + esc(c) + '</span></li>'; });
    body += '</ul>';
    body += '<div class="miss"><b>Most common miss</b>' + esc(g.miss) + '</div>';
  } else {
    body += '<p class="sub">No built-in demo for this one yet. The search below pulls up real video of it.</p>';
  }

  body += '<div style="height:12px"></div>' +
          '<a class="btn btn-ghost btn-block" href="' + esc(search) + '" target="_blank" rel="noopener noreferrer">Watch it on YouTube</a>' +
          '<div style="height:8px"></div>' +
          '<button class="btn btn-ghost btn-block" data-action="close-sheet">Back to the set</button>';

  openSheet(g ? g.title : name, body);
  if (g && !prefersReduced()) playDemo();
  else if (g) {
    var el = document.getElementById("demoSvg");
    if (el) el.innerHTML = figureMarkup(g, 0);
  }
}

/* =====================================================================
   RECORDS, MILESTONES AND GOALS
   Nothing here is stored except the goals you set - every record and
   streak is recomputed from the session log, so deleting a session
   correctly takes its PR with it.
   ===================================================================== */

/* Standard barbell milestones. The plate names are the ones people
   actually use: 135 lb and 60 kg are both "one plate" a side. */
var MILESTONES = [
  { label:"Bench Press",    match:["bench press","bench"], avoid:["incline"], lb:[95,135,185,225,275,315], kg:[40,60,80,100,120,140] },
  { label:"Back Squat",     match:["squat"], avoid:["split","bulgarian","lunge"], lb:[135,185,225,275,315,405], kg:[60,80,100,120,140,180] },
  { label:"Deadlift",       match:["deadlift"], avoid:["romanian","rdl","stiff","dumbbell","db ","single leg"], lb:[135,225,315,405,495], kg:[60,100,140,180,220] },
  { label:"Overhead Press", match:["overhead press","military","shoulder press"], lb:[75,95,115,135,155,185], kg:[30,40,50,60,70,80] },
  { label:"Barbell Row",    match:["barbell row","bent over row","pendlay"], lb:[95,135,185,225,275], kg:[40,60,80,100,120] },
  { label:"Lat Pulldown",   match:["pulldown","lat pull"], lb:[100,130,160,190,220], kg:[45,60,75,85,100] }
];
var PLATE_LB = { 135:"one plate", 225:"two plates", 315:"three plates", 405:"four plates", 495:"five plates" };
var PLATE_KG = { 60:"one plate", 100:"two plates", 140:"three plates", 180:"four plates", 220:"five plates" };
function plateName(w){
  var t = unit() === "kg" ? PLATE_KG : PLATE_LB;
  return t[w] || "";
}

/* Every completed set in the log, flattened. */
function allSets(){
  var out = [];
  finishedSessions().forEach(function(s){
    (s.entries || []).forEach(function(e){
      doneSets(e).forEach(function(x){
        out.push({ name:e.name, key:norm(e.name), w:num(x.w), r:num(x.r), ts:x.ts || s.start, pr:!!x.pr });
      });
    });
  });
  return out;
}
function nameMatches(key, m){
  var n = " " + key.replace(/[^a-z0-9]+/g, " ") + " ", i;
  if (m.avoid) for (i = 0; i < m.avoid.length; i++) if (n.indexOf(m.avoid[i]) >= 0) return false;
  for (i = 0; i < m.match.length; i++) if (n.indexOf(m.match[i]) >= 0) return true;
  return false;
}

/* One row per lift: heaviest set, best estimated 1RM, and when. */
function recordRows(){
  var map = {};
  allSets().forEach(function(x){
    var m = map[x.key];
    if (!m) m = map[x.key] = { name:x.name, bestW:0, bestWr:0, bestWts:0, bestE:0, bestEset:null, sets:0, last:0 };
    m.sets++;
    m.last = Math.max(m.last, x.ts);
    if (x.w > m.bestW) { m.bestW = x.w; m.bestWr = x.r; m.bestWts = x.ts; }
    var e = e1rm(x.w, x.r);
    if (e > m.bestE) { m.bestE = e; m.bestEset = x; }
  });
  return Object.keys(map).map(function(k){ return map[k]; })
    .sort(function(a, b){ return b.last - a.last; });
}

/* Heaviest single set for a milestone group. A milestone is about what
   you actually put on the bar, so this is real weight, not an estimate. */
function bestForMilestone(m){
  var best = { w:0, r:0, ts:0 };
  allSets().forEach(function(x){
    if (!nameMatches(x.key, m)) return;
    if (x.w > best.w) best = { w:x.w, r:x.r, ts:x.ts };
  });
  return best;
}
function inPlan(m){
  var hit = false;
  S.routines.forEach(function(r){
    r.exercises.forEach(function(e){ if (nameMatches(norm(e.name), m)) hit = true; });
  });
  return hit;
}

/* Heaviest weight moved for at least the goal's reps. */
function goalBest(g){
  var best = 0, ts = 0;
  allSets().forEach(function(x){
    if (x.key !== norm(g.name)) return;
    if (x.r < num(g.r)) return;
    if (x.w > best) { best = x.w; ts = x.ts; }
  });
  return { w:best, ts:ts };
}
/* Mark anything already earned, so goals added after the fact are honest. */
function syncGoals(){
  var changed = false;
  (S.goals || []).forEach(function(g){
    var b = goalBest(g);
    if (!g.done && b.w >= num(g.w)) { g.done = b.ts || Date.now(); changed = true; }
    if (g.done && b.w < num(g.w)) { g.done = 0; changed = true; }
  });
  if (changed) save();
}

/* ------------------------------ streaks ----------------------------- */
function weekStart(ts){
  var d = new Date(ts);
  d.setHours(0, 0, 0, 0);
  d.setDate(d.getDate() - ((d.getDay() + 6) % 7));   /* weeks run Monday to Sunday */
  return d.getTime();
}
function weekCounts(n){
  var thisWeek = weekStart(Date.now()), out = [], i;
  for (i = n - 1; i >= 0; i--) out.push({ start: thisWeek - i * 604800000, n: 0 });
  S.sessions.forEach(function(s){
    var w = weekStart(s.start);
    out.forEach(function(b){ if (b.start === w) b.n++; });
  });
  return out;
}
function lastNDays(days){
  var cut = Date.now() - days * 86400000, n = 0;
  S.sessions.forEach(function(s){ if (s.start >= cut) n++; });
  return n;
}
function totalVolume(){
  var v = 0;
  S.sessions.forEach(function(s){ v += sessionVolume(s); });
  return v;
}

/* Sessions per week, twelve weeks back. This week is picked out in red. */
function weeksChart(){
  var bars = weekCounts(12);
  var W = 640, H = 170, L = 34, R = 14, TP = 16, B = 30;
  var max = Math.max(3, bars.reduce(function(a, b){ return Math.max(a, b.n); }, 0));
  var iw = (W - L - R) / bars.length;
  var s = "";
  for (var k = 0; k <= max; k += Math.ceil(max / 3)) {
    var y = TP + (H - TP - B) * (1 - k / max);
    s += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) +
         '" stroke="currentColor" stroke-width="1" opacity="0.16"></line>' +
         '<text x="' + (L - 8) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="12" ' +
         'font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + k + '</text>';
  }
  bars.forEach(function(b, i){
    var h = (H - TP - B) * (b.n / max);
    var x = L + i * iw + iw * 0.18, w = iw * 0.64;
    var y = TP + (H - TP - B) - h;
    var live = i === bars.length - 1;
    if (b.n > 0) {
      s += '<rect x="' + x.toFixed(1) + '" y="' + y.toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="' + Math.max(2, h).toFixed(1) + '" rx="2.5" fill="' + (live ? "var(--red)" : "var(--blue)") + '"></rect>';
    } else {
      s += '<rect x="' + x.toFixed(1) + '" y="' + (TP + H - TP - B - 3).toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="3" rx="1.5" fill="currentColor" opacity="0.2"></rect>';
    }
  });
  s += '<text x="' + L + '" y="' + (H - 8) + '" font-size="12" font-family="IBM Plex Mono, monospace" ' +
       'fill="currentColor" opacity="0.6">' + dayLabel(bars[0].start) + '</text>' +
       '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" font-size="12" ' +
       'font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">this week</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
         'aria-label="Sessions per week over the last twelve weeks" style="color:var(--ink-2)">' + s + '</svg>';
}

function progressBar(pct, done){
  return '<div class="bar-track"><div class="bar-fill' + (done ? " done" : "") + '" style="width:' +
         Math.max(0, Math.min(100, pct)).toFixed(1) + '%"></div></div>';
}

/* ------------------------------- view ------------------------------- */
function viewGoals(){
  syncGoals();
  var sets = allSets();
  var h = '<div class="stack">';
  h += '<div><p class="eyebrow">Goals</p><h1 class="view-title">What you are chasing</h1></div>';
  h += checkinCard();

  h += '<div class="stats">' +
         '<div class="stat"><div class="k">Last 7 days</div><div class="v">' + lastNDays(7) + '<small>sessions</small></div></div>' +
         '<div class="stat"><div class="k">All time</div><div class="v">' + S.sessions.length + '<small>sessions</small></div></div>' +
         '<div class="stat"><div class="k">Moved</div><div class="v">' + Math.round(totalVolume() / 1000) + '<small>k ' + unit() + '</small></div></div>' +
       '</div>';

  /* ---- plate milestones ---- */
  /* Closest to falling first - that is the one worth looking at today. */
  var groups = MILESTONES.filter(function(m){ return inPlan(m) || bestForMilestone(m).w > 0; })
    .map(function(m){
      var best = bestForMilestone(m);
      var ladder = unit() === "kg" ? m.kg : m.lb;
      var next = null;
      for (var i = 0; i < ladder.length; i++) { if (ladder[i] > best.w) { next = ladder[i]; break; } }
      var target = next === null ? ladder[ladder.length - 1] : next;
      return { m:m, best:best, next:next, target:target, pct: next === null ? 100 : (best.w / target) * 100 };
    })
    .sort(function(a, b){ return b.pct - a.pct; });
  if (groups.length) {
    h += '<div><p class="eyebrow" style="margin-bottom:8px">Next on the bar</p><div class="stack" style="gap:8px">';
    groups.forEach(function(row){
      var m = row.m, best = row.best, next = row.next, target = row.target, pct = row.pct;
      var pn = plateName(target);
      h += '<div class="card ms">' +
             '<div class="ms-top"><span class="n">' + esc(m.label) + '</span>' +
               '<span class="v">' + fmt(best.w) + ' / ' + fmt(target) + ' ' + unit() + '</span></div>' +
             progressBar(pct, next === null) +
             '<div class="ms-note">' +
               (next === null
                 ? "Every milestone cleared. Best set " + fmt(best.w) + " x " + fmt(best.r) + "."
                 : (best.w > 0
                     ? fmt(target - best.w) + " " + unit() + " to go" + (pn ? " - " + pn : "") + "."
                     : "Log a set and this starts tracking" + (pn ? ". First target: " + pn : "") + ".")) +
             '</div>' +
             (next === null ? "" :
               '<div><button class="btn btn-ghost btn-sm" data-action="goal-from" data-name="' + esc(m.label) +
               '" data-w="' + target + '">Make this a goal</button></div>') +
           '</div>';
    });
    h += '</div></div>';
  }

  /* ---- your own goals ---- */
  var goals = S.goals || [];
  var open = goals.filter(function(g){ return !g.done; });
  var won = goals.filter(function(g){ return g.done; }).sort(function(a, b){ return b.done - a.done; });

  h += '<div><div class="row" style="margin-bottom:8px"><p class="eyebrow">Your goals</p>' +
       '<button class="btn btn-ghost btn-sm pull-right" data-action="goal-sheet">+ Add a goal</button></div>';
  if (!open.length && !won.length) {
    h += '<div class="card empty"><h3>Nothing set yet</h3>' +
         '<p>Pick a lift and a number - "Bench 225 for 5" - and it fills in as you get closer.</p></div>';
  }
  h += '<div class="stack" style="gap:8px">';
  open.forEach(function(g){
    var b = goalBest(g);
    h += '<div class="card ms">' +
           '<div class="ms-top"><span class="n">' + esc(g.name) + '</span>' +
             '<span class="v">' + fmt(b.w) + ' / ' + fmt(g.w) + ' ' + unit() + ' x ' + fmt(g.r) + '</span></div>' +
           progressBar((b.w / num(g.w)) * 100) +
           '<div class="ms-note">' +
             (b.w > 0 ? fmt(num(g.w) - b.w) + " " + unit() + " to go at " + fmt(g.r) + " reps."
                      : "No set at " + fmt(g.r) + " reps yet.") +
             ' <button class="btn-link" data-action="del-goal" data-id="' + g.id + '">Remove</button>' +
           '</div>' +
         '</div>';
  });
  won.forEach(function(g){
    h += '<div class="card ms">' +
           '<div class="ms-top"><span class="n">' + esc(g.name) + '</span>' +
             '<span class="v" style="color:var(--green)">' + fmt(g.w) + ' x ' + fmt(g.r) + '</span></div>' +
           progressBar(100, true) +
           '<div class="ms-note">Hit on ' + dayLabel(g.done) + '. ' +
             '<button class="btn-link" data-action="del-goal" data-id="' + g.id + '">Remove</button></div>' +
         '</div>';
  });
  h += '</div></div>';

  /* ---- consistency ---- */
  h += '<div><p class="eyebrow" style="margin-bottom:8px">Sessions per week</p>' +
       '<div class="card card-pad"><div class="chart-box">' + weeksChart() + '</div></div></div>';

  /* ---- personal records ---- */
  var rows = recordRows();
  h += '<div><p class="eyebrow" style="margin-bottom:8px">Personal records</p>';
  if (!rows.length) {
    h += '<div class="card empty"><h3>No records yet</h3>' +
         '<p>Finish a session and every lift in it gets a line here: your heaviest set and your best estimated one-rep max.</p></div>';
  } else {
    h += '<div class="card">';
    rows.forEach(function(r){
      h += '<button class="rec" data-action="open-exercise" data-name="' + esc(r.name) + '">' +
             '<div class="ms-top"><span class="n">' + esc(r.name) + '</span>' +
               '<span class="v">' + fmt(r.bestW) + ' x ' + fmt(r.bestWr) + '</span></div>' +
             '<div class="ms-note">Best e1RM ' + fmt(Math.round(r.bestE)) + ' ' + unit() +
               ' &middot; ' + r.sets + ' sets &middot; heaviest on ' + dayLabel(r.bestWts) + '</div>' +
           '</button>';
    });
    h += '</div>';
  }
  h += '</div>';

  /* ---- the PR feed ---- */
  var prs = sets.filter(function(x){ return x.pr; }).sort(function(a, b){ return b.ts - a.ts; }).slice(0, 12);
  if (prs.length) {
    h += '<div><p class="eyebrow" style="margin-bottom:8px">Recently broken</p><div class="card">';
    prs.forEach(function(x){
      h += '<div class="rec"><div class="ms-top"><span class="n">' + esc(x.name) + '</span>' +
           '<span class="v">' + fmt(x.w) + ' x ' + fmt(x.r) + '</span></div>' +
           '<div class="ms-note">' + dayLabel(x.ts) + '</div></div>';
    });
    h += '</div></div>';
  }

  h += '</div>';
  return h;
}

function goalSheet(name, w){

/* =====================================================================
   DAILY CHECK-IN - bodyweight, protein, creatine
   All three are keyed by local calendar day, so logging twice in a day
   corrects the day rather than adding a second one.
   ===================================================================== */

function p2(n){ return n < 10 ? "0" + n : "" + n; }
function dayKey(ts){
  var d = new Date(ts);
  return d.getFullYear() + "-" + p2(d.getMonth() + 1) + "-" + p2(d.getDate());
}
function keyTs(k){
  var a = k.split("-");
  return new Date(+a[0], +a[1] - 1, +a[2]).getTime();
}
function today(){ return dayKey(Date.now()); }
function body(){
  if (!S.body) S.body = { goalW:0, pTarget:150, w:{}, p:{}, c:{} };
  return S.body;
}
function proteinOn(k){
  var list = body().p[k] || [], t = 0;
  list.forEach(function(g){ t += num(g); });
  return t;
}
function latestWeight(){
  var keys = Object.keys(body().w).sort();
  if (!keys.length) return null;
  var k = keys[keys.length - 1];
  return { k:k, v:num(body().w[k]) };
}
function weightSeries(){
  return Object.keys(body().w).sort().map(function(k){
    return { t:keyTs(k), v:num(body().w[k]) };
  });
}
/* A seven-day average is the only honest way to read a bathroom scale -
   day to day it is mostly water, food and salt. */
function movingAvg(series, days){
  return series.map(function(p, i){
    var lo = p.t - (days - 1) * 86400000, sum = 0, n = 0;
    for (var j = i; j >= 0; j--) {
      if (series[j].t < lo) break;
      sum += series[j].v; n++;
    }
    return { t:p.t, v: n ? sum / n : p.v };
  });
}
function weightStats(){
  var s = weightSeries();
  if (!s.length) return null;
  var ma = movingAvg(s, 7);
  var last = ma[ma.length - 1];
  var target = last.t - 30 * 86400000, ref = ma[0];
  for (var i = 0; i < ma.length; i++) { if (ma[i].t <= target) ref = ma[i]; }
  return {
    latest: s[s.length - 1].v,
    latestTs: s[s.length - 1].t,
    avg: last.v,
    change: ma.length > 1 ? last.v - ref.v : 0,
    spanDays: Math.round((last.t - ref.t) / 86400000)
  };
}
function lastDays(n){
  var out = [], t0 = keyTs(today());
  for (var i = n - 1; i >= 0; i--) out.push(dayKey(t0 - i * 86400000));
  return out;
}
function proteinHitRate(n){
  var target = num(body().pTarget), hit = 0;
  if (target <= 0) return null;
  lastDays(n).forEach(function(k){ if (proteinOn(k) >= target) hit++; });
  return hit;
}
function creatineStreak(){
  var n = 0, t0 = keyTs(today());
  for (var i = 0; i < 400; i++) {
    var k = dayKey(t0 - i * 86400000);
    if (body().c[k]) n++;
    else if (i > 0) break;          /* today not logged yet does not break it */
  }
  return n;
}

/* ------------------------------ charts ------------------------------ */
function weightChart(){
  var s = weightSeries();
  if (s.length < 2) {
    return '<p class="sub" style="margin:8px 0">Two weigh-ins and the trend line starts. Same time of day is what makes it comparable.</p>';
  }
  var ma = movingAvg(s, 7);
  var W = 640, H = 220, L = 52, R = 16, TP = 16, B = 30;
  var vals = s.map(function(p){ return p.v; });
  var lo = Math.min.apply(null, vals), hi = Math.max.apply(null, vals);
  if (hi === lo) { hi = lo + 1; lo = lo - 1; }
  var pad = (hi - lo) * 0.2;
  hi += pad; lo -= pad;
  var t0 = s[0].t, t1 = s[s.length - 1].t;
  function X(t){ return t1 === t0 ? L : L + (W - L - R) * ((t - t0) / (t1 - t0)); }
  function Y(v){ return TP + (H - TP - B) * (1 - (v - lo) / (hi - lo)); }

  var g = "";
  for (var k = 0; k <= 3; k++) {
    var v = lo + (hi - lo) * k / 3, y = Y(v);
    g += '<line x1="' + L + '" y1="' + y.toFixed(1) + '" x2="' + (W - R) + '" y2="' + y.toFixed(1) +
         '" stroke="currentColor" stroke-width="1" opacity="0.16"></line>' +
         '<text x="' + (L - 9) + '" y="' + (y + 4).toFixed(1) + '" text-anchor="end" font-size="12" ' +
         'font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + (Math.round(v * 10) / 10) + '</text>';
  }
  var dots = s.map(function(p){
    return '<circle cx="' + X(p.t).toFixed(1) + '" cy="' + Y(p.v).toFixed(1) +
           '" r="2.6" fill="currentColor" opacity="0.4"></circle>';
  }).join("");
  var line = ma.map(function(p, i){ return (i ? "L" : "M") + X(p.t).toFixed(1) + " " + Y(p.v).toFixed(1); }).join(" ");
  var end = ma[ma.length - 1];

  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
         'aria-label="Bodyweight with a seven day average" style="color:var(--ink-2)">' + g + dots +
         '<path d="' + line + '" fill="none" stroke="var(--blue)" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"></path>' +
         '<circle cx="' + X(end.t).toFixed(1) + '" cy="' + Y(end.v).toFixed(1) + '" r="5.5" fill="var(--red)" stroke="var(--surface)" stroke-width="2.5"></circle>' +
         '<text x="' + L + '" y="' + (H - 8) + '" font-size="12" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + dayLabel(t0) + '</text>' +
         '<text x="' + (W - R) + '" y="' + (H - 8) + '" text-anchor="end" font-size="12" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + dayLabel(t1) + '</text>' +
         '</svg>';
}

function proteinChart(){
  var days = lastDays(14), target = num(body().pTarget);
  var W = 640, H = 180, L = 40, R = 14, TP = 16, B = 28;
  var max = Math.max(target * 1.2, 10);
  days.forEach(function(k){ max = Math.max(max, proteinOn(k) * 1.1); });
  var iw = (W - L - R) / days.length;
  var s = "";
  function Y(v){ return TP + (H - TP - B) * (1 - v / max); }

  s += '<line x1="' + L + '" y1="' + Y(0) + '" x2="' + (W - R) + '" y2="' + Y(0) +
       '" stroke="currentColor" stroke-width="1" opacity="0.2"></line>';
  days.forEach(function(k, i){
    var v = proteinOn(k), h = (H - TP - B) * (v / max);
    var x = L + i * iw + iw * 0.2, w = iw * 0.6;
    if (v <= 0) {
      s += '<rect x="' + x.toFixed(1) + '" y="' + (Y(0) - 3).toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="3" rx="1.5" fill="currentColor" opacity="0.18"></rect>';
    } else {
      s += '<rect x="' + x.toFixed(1) + '" y="' + Y(v).toFixed(1) + '" width="' + w.toFixed(1) +
           '" height="' + Math.max(2, h).toFixed(1) + '" rx="2.5" fill="' +
           (target > 0 && v >= target ? "var(--green)" : "var(--blue)") + '"></rect>';
    }
  });
  if (target > 0) {
    s += '<line x1="' + L + '" y1="' + Y(target).toFixed(1) + '" x2="' + (W - R) + '" y2="' + Y(target).toFixed(1) +
         '" stroke="var(--red)" stroke-width="2" stroke-dasharray="6 5" opacity="0.9"></line>' +
         '<text x="' + (L - 7) + '" y="' + (Y(target) + 4).toFixed(1) + '" text-anchor="end" font-size="12" ' +
         'font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.7">' + Math.round(target) + '</text>';
  }
  s += '<text x="' + L + '" y="' + (H - 7) + '" font-size="12" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">' + dayLabel(keyTs(days[0])) + '</text>' +
       '<text x="' + (W - R) + '" y="' + (H - 7) + '" text-anchor="end" font-size="12" font-family="IBM Plex Mono, monospace" fill="currentColor" opacity="0.6">today</text>';
  return '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" role="img" ' +
         'aria-label="Protein per day for the last fourteen days" style="color:var(--ink-2)">' + s + '</svg>';
}

/* ------------------------------ painting ---------------------------- */
function paintTimer(){
  var strip = $("#timerStrip");
  var show = (T.running || T.paused > 0) && V.view !== "timer";
  var left = T.running ? restRemaining() : T.paused;
  if (strip) {
    strip.hidden = !show;
    if (show) {
      $("#stripLabel").textContent = T.mode === "interval"
        ? T.label + " - round " + T.iv.round + "/" + T.iv.rounds : T.label;
      var st = $("#stripTime");
      st.textContent = clock(left);
      if (left <= 10) st.classList.add("warn"); else st.classList.remove("warn");
    }
  }
  var big = $("#bigTime");
  if (big) {
    var shown = T.running ? left : (T.paused > 0 ? T.paused : T.total);
    big.textContent = clock(shown);
    if (T.running && left <= 10) big.classList.add("warn"); else big.classList.remove("warn");
    $("#bigCap").textContent = T.label;
    $("#bigPhase").innerHTML = T.mode === "interval"
      ? "Round " + T.iv.round + " of " + T.iv.rounds : "&nbsp;";
    $("#bigBar").style.width = (T.total > 0 ? Math.max(0, Math.min(1, shown / T.total)) * 100 : 0) + "%";
    var tb = $("#toggleBtn");
    if (tb) tb.textContent = T.running ? "Pause" : (T.paused > 0 ? "Resume" : "Start");
  }
  var sw = $("#swTime");
  if (sw) sw.textContent = dur(swElapsed());
}

/* ------------------------------ session ----------------------------- */
function findEntry(id){
  var out = null;
  if (S.active) S.active.entries.forEach(function(e){ if (e.id === id) out = e; });
  return out;
}
function newEntry(name, target, reps, rest){
  var n = Math.max(1, Math.round(num(target) || 3));
  var sets = [];
  for (var i = 0; i < n; i++) sets.push({ w:"", r:"", done:false });
  return { id:uid(), name:name, target:n, reps:String(reps || ""), rest:num(rest) || num(S.settings.rest), sets:sets };
}
function startRoutine(id){
  var r = null;
  S.routines.forEach(function(x){ if (x.id === id) r = x; });
  if (!r) return;
  if (S.active && sessionSetCount(S.active) > 0) {
    return askSheet("A session is already running", "Finish or discard " + S.active.name + " before starting another one.", "Discard it", "discard-confirm");
  }
  S.active = {
    id: uid(), routineId: r.id, name: r.name, start: Date.now(), end: 0,
    entries: r.exercises.map(function(e){ return newEntry(e.name, e.sets, e.reps, e.rest); })
  };
  save();
  V.routineId = null;
  go("train");
  toast("Session started. The clock is running.");
}
function startEmpty(){
  var d = new Date();
  var label = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"][d.getDay()] + " session";
  S.active = { id:uid(), routineId:null, name:label, start:Date.now(), end:0, entries:[] };
  save();
  go("train");
}
function bestInActive(name, skipEntryId, skipIndex){
  var key = norm(name), best = 0;
  if (!S.active) return 0;
  S.active.entries.forEach(function(e){
    if (norm(e.name) !== key) return;
    e.sets.forEach(function(s, i){
      if (!s.done) return;
      if (e.id === skipEntryId && i === skipIndex) return;
      best = Math.max(best, e1rm(s.w, s.r));
    });
  });
  return best;
}
function logSet(exId, i){
  var e = findEntry(exId);
  if (!e) return;
  var s = e.sets[i];
  if (!s) return;

  if (s.done) { s.done = false; s.pr = false; save(); render(); return; }

  if (num(s.r) <= 0) { toast("Put the reps in first."); return; }

  s.done = true;
  s.ts = Date.now();
  var prior = Math.max(bestE1rm(e.name), bestInActive(e.name, e.id, i));
  s.pr = prior > 0 && e1rm(s.w, s.r) > prior + 0.01;

  /* Carry the weight down to the next empty set - you usually repeat it. */
  var next = e.sets[i + 1];
  if (next && !next.done && (next.w === "" || next.w == null)) next.w = s.w;

  /* Did that set finish anything you were chasing? */
  var landed = null;
  (S.goals || []).forEach(function(g){
    if (g.done || norm(g.name) !== norm(e.name)) return;
    if (num(s.w) >= num(g.w) && num(s.r) >= num(g.r)) { g.done = Date.now(); landed = g; }
  });

  save();
  startRest(num(e.rest) || num(S.settings.rest), "Rest");
  render();
  if (landed) toast("Goal hit: " + landed.name + " " + fmt(landed.w) + " x " + fmt(landed.r) + ".");
  else if (s.pr) toast("New best on " + e.name + ": " + fmt(s.w) + " x " + fmt(s.r) + ".");
}
function finishSession(){
  var a = S.active;
  if (!a) return;
  if (sessionSetCount(a) === 0) {
    return askSheet("Nothing logged", "No sets were ticked off, so there is nothing to save.", "Discard it", "discard-confirm");
  }
  a.end = Date.now();
  a.entries = a.entries.filter(function(e){ return doneSets(e).length > 0; })
    .map(function(e){ return { id:e.id, name:e.name, target:e.target, reps:e.reps, rest:e.rest, sets:doneSets(e) }; });
  S.sessions.push(a);
  S.active = null;
  stopTimer();
  releaseWakeLock();
  save();
  V.view = "log"; V.logTab = "sessions"; V.sessionId = a.id;
  render();
  window.scrollTo(0, 0);
  var n = sessionSetCount(a);
  toast("Saved: " + n + (n === 1 ? " set, " : " sets, ") + fmt(Math.round(sessionVolume(a))) + " " + unit() + ".");
}

function doPlates(){
  var total = num($("#plTotal").value), bar = num($("#plBar").value);
  var out = $("#plOut");
  if (total <= 0) { out.innerHTML = '<p class="sub">Type the weight you want on the bar.</p>'; return; }
  var res = plateMath(total, bar);
  if (!res.ok) { out.innerHTML = '<p class="sub">' + fmt(total) + ' ' + unit() + ' is at or under the bar itself.</p>'; return; }
  var colors = { 45:"var(--red)", 35:"var(--blue)", 25:"var(--green)", 20:"var(--blue)", 15:"var(--amber)", 10:"var(--green)", 5:"var(--ink-2)", 2.5:"var(--ink-3)", 1.25:"var(--ink-3)" };
  var html = '<p class="eyebrow">Per side &middot; ' + fmt(res.perSide) + ' ' + unit() + '</p><div class="plates">';
  res.plates.forEach(function(p){
    html += '<span class="plate" style="background:' + (colors[p] || "var(--ink-2)") + '">' + fmt(p) + '</span>';
  });
  html += '</div>';
  if (res.leftover > 0) html += '<p class="sub" style="margin-top:8px">' + fmt(res.leftover) + ' ' + unit() + ' per side short - nearest you can load is ' + fmt(total - res.leftover * 2) + '.</p>';
  out.innerHTML = html;
}

  var box = $("#dataBox");

  try { ok = document.execCommand("copy"); } catch (e) {}

    navigator.clipboard.writeText(box.value).then(function(){ toast("Copied. Paste it somewhere safe."); },
      function(){ toast("Select the text and copy it by hand."); });
    return;
  }

function loadData(){
  var raw = $("#dataBox").value.trim();
  if (!raw) { toast("Paste your backup into the box first."); return; }
  var p;
  try { p = JSON.parse(raw); } catch (e) { toast("That is not a readable backup."); return; }
  if (!p || !Array.isArray(p.sessions) || !Array.isArray(p.routines)) { toast("That backup is missing its routines or sessions."); return; }
  S.settings = Object.assign(defaults().settings, p.settings || {});
  S.routines = p.routines;
  S.sessions = p.sessions;
  S.goals = Array.isArray(p.goals) ? p.goals : [];
  S.body = Object.assign(defaults().body, p.body || {});
  S.active = null;
  save();
  applyTheme();
  render();
  toast("Loaded " + p.sessions.length + " sessions.");
}

/* ------------------------------ events ------------------------------ */
var saveT = null;
function saveSoon(){ clearTimeout(saveT); saveT = setTimeout(save, 300); }

document.addEventListener("click", function(ev){
  var btn = ev.target.closest ? ev.target.closest("[data-action]") : null;
  if (ev.target === $("#scrim")) { closeSheet(); return; }
  if (!btn) return;
  var a = btn.getAttribute("data-action");
  var id = btn.getAttribute("data-id");
  var exId = btn.getAttribute("data-ex");
  audioReady();

  switch (a) {
    case "tab": go(btn.getAttribute("data-view")); break;
    case "go-settings": go("settings"); break;
    case "go-timer": go("timer"); break;
    case "cycle-theme": {
      var order = ["system", "light", "dark"];
      var next = order[(order.indexOf(S.settings.theme) + 1) % 3];
      S.settings.theme = next; save(); applyTheme();
      toast("Theme: " + next);
      break;
    }

    case "start-routine": startRoutine(id); break;
    case "start-empty": startEmpty(); break;
    case "add-exercise": addExerciseSheet(); break;
    case "do-add-exercise": {
      var nm = $("#axName").value.trim();
      if (!nm) { toast("Give the lift a name."); break; }
      if (!S.active) startEmpty();
      S.active.entries.push(newEntry(nm, $("#axSets").value, $("#axReps").value, $("#axRest").value));
      save(); closeSheet(); render();
      break;
    }
    case "ex-menu": exMenuSheet(exId); break;
    case "save-ex": {
      var e1 = findEntry(id);
      if (e1) { e1.name = $("#emName").value.trim() || e1.name; e1.reps = $("#emReps").value; e1.rest = num($("#emRest").value); }
      save(); closeSheet(); render();
      break;
    }
    case "remove-ex": {
      S.active.entries = S.active.entries.filter(function(x){ return x.id !== id; });
      save(); closeSheet(); render();
      break;
    }
    case "add-set": {
      var e2 = findEntry(exId);
      if (e2) {
        var lastW = "";
        e2.sets.forEach(function(s){ if (s.w !== "" && s.w != null) lastW = s.w; });
        e2.sets.push({ w:lastW, r:"", done:false });
        e2.target = Math.max(e2.target, e2.sets.length);
        save(); render();
      }
      break;
    }
    case "log-set": logSet(exId, parseInt(btn.getAttribute("data-i"), 10)); break;
    case "plate-sheet": plateSheet(exId); break;
    case "form-sheet": formSheet(btn.getAttribute("data-name")); break;
    case "demo-play": playDemo(); break;
    case "do-plates": doPlates(); break;
    case "rest-now": {
      var e3 = findEntry(exId);
      startRest(e3 ? num(e3.rest) : num(S.settings.rest), "Rest");
      break;
    }
    case "finish": finishSession(); break;
    case "discard": askSheet("Discard this session?", "Every set in it goes away. This cannot be undone.", "Discard", "discard-confirm"); break;
    case "discard-confirm": {
      S.active = null; stopTimer(); releaseWakeLock(); save(); closeSheet(); go("train");
      break;
    }

    case "rest-start": startRest(num(btn.getAttribute("data-sec")), "Rest"); break;
    case "rest-custom": {
      var c = num($("#customRest").value);
      if (c > 0) { S.settings.rest = c; save(); startRest(c, "Rest"); }
      break;
    }
    case "rest-add": nudgeTimer(num(btn.getAttribute("data-sec"))); break;
    case "rest-skip": {
      stopTimer(); releaseWakeLock();
      if (T.mode === "interval") { T.iv.round = 1; T.iv.phase = "work"; T.total = T.iv.work; T.label = "Work"; }
      else { T.total = num(S.settings.rest); T.label = "Rest"; }
      render();
      break;
    }
    case "timer-toggle": {
      if (T.running) pauseTimer();
      else if (T.paused > 0) resumeTimer();
      else if (T.mode === "interval") startInterval();
      else startRest(T.total || num(S.settings.rest), "Rest");
      render();
      break;
    }
    case "timer-mode": {
      var m = btn.getAttribute("data-mode");
      if (m !== T.mode) {
        stopTimer();
        T.mode = m;
        T.label = m === "interval" ? "Work" : "Rest";
        T.total = m === "interval" ? T.iv.work : num(S.settings.rest);
        render();
      }
      break;
    }
    case "interval-start": {
      T.iv.work = Math.max(1, num($("#ivWork").value));
      T.iv.rest = Math.max(0, num($("#ivRest").value));
      T.iv.rounds = Math.max(1, num($("#ivRounds").value));
      startInterval(); render();
      break;
    }
    case "sw-toggle": {
      if (SW.running) { SW.acc += Date.now() - SW.start; SW.running = false; }
      else { SW.start = Date.now(); SW.running = true; audioReady(); }
      render();
      break;
    }
    case "sw-reset": SW.running = false; SW.acc = 0; render(); break;

    case "log-tab": V.logTab = btn.getAttribute("data-tab"); render(); break;
    case "open-session": V.sessionId = id; render(); window.scrollTo(0, 0); break;
    case "open-exercise": V.view = "log"; V.exName = btn.getAttribute("data-name"); render(); window.scrollTo(0, 0); break;
    case "back-log": V.sessionId = null; V.exName = null; render(); window.scrollTo(0, 0); break;
    case "delete-session": askSheet("Delete this session?", "It is removed from your history and from every trend line.", "Delete", "delete-session-confirm", id); break;
    case "delete-session-confirm": {
      S.sessions = S.sessions.filter(function(x){ return x.id !== id; });
      V.sessionId = null; save(); closeSheet(); render();
      break;
    }

    case "edit-routine": V.routineId = id; render(); window.scrollTo(0, 0); break;
    case "back-plan": V.routineId = null; render(); window.scrollTo(0, 0); break;
    case "new-routine": {
      var r2 = { id:uid(), name:"New routine", color:"blue", exercises:[{ id:uid(), name:"", sets:3, reps:"8", rest:num(S.settings.rest) }] };
      S.routines.push(r2); V.routineId = r2.id; save(); render();
      break;
    }
    case "add-routine-ex": {
      var r3 = currentRoutine();
      if (r3) { r3.exercises.push({ id:uid(), name:"", sets:3, reps:"8", rest:num(S.settings.rest) }); save(); render(); }
      break;
    }
    case "del-routine-ex": {
      var r4 = currentRoutine();
      if (r4) { r4.exercises = r4.exercises.filter(function(x){ return x.id !== id; }); save(); render(); }
      break;
    }
    case "dup-routine": {
      var r5 = currentRoutine();
      if (r5) {
        var copy = JSON.parse(JSON.stringify(r5));
        copy.id = uid(); copy.name = r5.name + " (copy)";
        copy.exercises.forEach(function(x){ x.id = uid(); });
        S.routines.push(copy); V.routineId = copy.id; save(); render();
      }
      break;
    }
    case "del-routine": askSheet("Delete this routine?", "Sessions you already finished from it stay in your log.", "Delete", "del-routine-confirm", id); break;
    case "del-routine-confirm": {
      S.routines = S.routines.filter(function(x){ return x.id !== id; });
      V.routineId = null; save(); closeSheet(); render();
      break;
    }

    case "open-body": V.body = true; render(); window.scrollTo(0, 0); break;
    case "back-goals": V.body = false; render(); window.scrollTo(0, 0); break;
    case "log-weight": {
      var wv = num($("#bwInput").value);
      if (wv <= 0) { toast("Put a number in first."); break; }
      body().w[today()] = wv;
      save(); render();
      toast("Logged " + fmt(wv) + " " + unit() + " for today.");
      break;
    }
    case "protein-add": {
      var k1 = today();
      if (!body().p[k1]) body().p[k1] = [];
      body().p[k1].push(num(btn.getAttribute("data-g")));
      save(); render();
      break;
    }
    case "protein-custom": {
      var pc = num($("#pCustom").value);
      if (pc <= 0) { toast("How many grams?"); break; }
      var k2 = today();
      if (!body().p[k2]) body().p[k2] = [];
      body().p[k2].push(pc);
      save(); render();
      break;
    }
    case "protein-undo": {
      var k3 = today(), idx = parseInt(btn.getAttribute("data-i"), 10);
      if (body().p[k3]) { body().p[k3].splice(idx, 1); save(); render(); }
      break;
    }
    case "protein-suggest": {
      var lw2 = latestWeight();
      if (lw2) { body().pTarget = Math.round(unit() === "kg" ? lw2.v * 2 : lw2.v); save(); render(); }
      break;
    }
    case "creatine-toggle": {
      var k4 = today();
      if (body().c[k4]) delete body().c[k4]; else body().c[k4] = 1;
      save(); render();
      break;
    }

    case "goal-sheet": goalSheet("", ""); break;
    case "goal-from": goalSheet(btn.getAttribute("data-name"), btn.getAttribute("data-w")); break;
    case "do-add-goal": {
      var gn = $("#glName").value.trim(), gw = num($("#glW").value), gr = num($("#glR").value);
      if (!gn) { toast("Which lift is the goal for?"); break; }
      if (gw <= 0 || gr <= 0) { toast("Give it a weight and a rep count."); break; }
      S.goals.push({ id:uid(), name:gn, w:gw, r:gr, created:Date.now(), done:0 });
      save(); closeSheet(); V.view = "goals"; render();
      break;
    }
    case "del-goal": {
      S.goals = S.goals.filter(function(x){ return x.id !== id; });
      save(); render();
      break;
    }

    case "copy-data": copyData(); break;
    case "load-data": loadData(); break;
    case "wipe": askSheet("Erase everything?", "Every session, routine and setting on this device is deleted for good.", "Erase it all", "wipe-confirm"); break;
    case "wipe-confirm": {
      try { localStorage.removeItem(KEY); } catch (e) {}
      S = defaults(); save(); closeSheet(); applyTheme(); go("train");
      toast("Wiped. Starting fresh.");
      break;
    }

    case "force-update": {
      toast("Checking for a newer build...");
      var reload = function(){ location.reload(); };
      try {
        if (navigator.serviceWorker && navigator.serviceWorker.getRegistration) {
          navigator.serviceWorker.getRegistration().then(function(r){
            if (r && r.update) { r.update().then(reload, reload); } else { reload(); }
          }, reload);
        } else { reload(); }
      } catch (e) { reload(); }
      break;
    }

    case "close-sheet": closeSheet(); break;
  }
});

function currentRoutine(){
  var out = null;
  S.routines.forEach(function(x){ if (x.id === V.routineId) out = x; });
  return out;
}

function onFieldChange(ev){
  var t = ev.target;
  if (!t || !t.getAttribute) return;

  if (t.classList.contains("inp") && t.getAttribute("data-ex") && t.getAttribute("data-f")) {
    var e = findEntry(t.getAttribute("data-ex"));
    if (!e) return;
    var s = e.sets[parseInt(t.getAttribute("data-i"), 10)];
    if (!s) return;
    s[t.getAttribute("data-f")] = t.value;
    saveSoon();
    return;
  }
  var rex = t.getAttribute("data-rex");
  if (rex) {
    var r = currentRoutine();
    if (!r) return;
    r.exercises.forEach(function(x){
      if (x.id !== rex) return;
      var f = t.getAttribute("data-f");
      x[f] = (f === "sets" || f === "rest") ? num(t.value) : t.value;
    });
    saveSoon();
    return;
  }
  if (t.id === "rName") {
    var r6 = currentRoutine();
    if (r6) { r6.name = t.value; saveSoon(); }
    return;
  }
  var bf = t.getAttribute("data-bf");
  if (bf) {
    body()[bf] = num(t.value);
    saveSoon();
    if (ev.type === "change") render();
    return;
  }
  var sf = t.getAttribute("data-sf");
  if (sf) {
    S.settings[sf] = (t.type === "checkbox") ? t.checked
      : (sf === "unit" || sf === "theme") ? t.value : num(t.value);
    save();
    if (sf === "unit") render();
    if (sf === "wake" && !t.checked) releaseWakeLock();
    return;
  }
}
document.addEventListener("input", onFieldChange);
document.addEventListener("change", onFieldChange);

/* Enter in a set field acts like the tick button. */
document.addEventListener("keydown", function(ev){
  if (ev.key !== "Enter") return;
  var t = ev.target;
  if (t && t.classList && t.classList.contains("inp") && t.getAttribute("data-ex") && t.getAttribute("data-f") === "r") {
    ev.preventDefault();
    t.blur();
    logSet(t.getAttribute("data-ex"), parseInt(t.getAttribute("data-i"), 10));
  }
  if (ev.key === "Escape") closeSheet();
});

document.addEventListener("visibilitychange", function(){
  if (!document.hidden) { tick(); if (T.running) requestWakeLock(); }
});

/* On a real site, keep a copy on the phone so it opens without signal,
   and still take a new build whenever one is up. No-op on file:// and in
   sandboxed previews. */
if ("serviceWorker" in navigator && location.protocol.indexOf("http") === 0) {
  try { navigator.serviceWorker.register("sw.js").catch(function(){}); } catch (e) {}
}

/* ------------------------------- boot ------------------------------- */
S = load();
applyTheme();
render();
setInterval(tick, 200);
document.addEventListener("pointerdown", audioReady, { once: true });
</script>

</body>
</html>
